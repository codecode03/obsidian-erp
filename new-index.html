  return `<th class="${i === 0 ? 'pl-4 pr-2' : i === n - 1 ? 'pr-4 pl-3' : 'px-3'} py-2.5 fs-head font-semibold text-muted text-${right ? 'right' : 'left'} whitespace-nowrap">${escapeHtml(label)}</th>`;
}
function prodTile(label, value, note) {
  return `<div class="bg-cardBg border border-side-panel rounded-lg card-shadow p-4">
    <p class="text-micro text-muted mb-1">${escapeHtml(label)}</p>
    <p class="fs-title font-semibold text-primary tabular">${value}</p>
    ${note ? `<p class="text-helper text-muted mt-1">${escapeHtml(note)}</p>` : ''}
  </div>`;
}
function prodMsgClass(msg, tone) { return `${msg ? '' : 'hidden '}text-helper text-${tone} mr-auto`; }

/* One control renderer for every Production form. Style / Buyer / Employee pickers read the
   Merchandising and HR masters instead of free text, so a style means the same thing everywhere. */
function prodControl(f, val, attr) {
  const v = val == null ? '' : String(val);
  if (f.type === 'auto') return `<input type="text" readonly id="prodAuto-${f.k}" value="${escapeHtml(v)}" class="${COA_AUTO} tabular" />`;
  if (f.type === 'employee') {
    const list = hrEmployees.filter(e => (e.status === 'Active' && (!hrFromErp || !f.stage || e.stage === f.stage)) || String(e.id) === v);
    return `<select ${attr} class="${COA_INPUT}"><option value="">${hrFromErp && f.stage && list.length === 0 ? 'No ' + f.stage + ' employee (set in HR → Employee)' : 'Select employee…'}</option>${list.map(e => `<option value="${e.id}" ${String(e.id) === v ? 'selected' : ''}>${escapeHtml(hrEmpLabel(e))}</option>`).join('')}</select>`;
  }
  if (f.type === 'plan') {
    const list = prodRecords.planning, known = list.some(o => String(o.id) === v);
    return `<select ${attr} class="${COA_INPUT}"><option value="">Select plan…</option>${v && !known ? `<option value="${escapeHtml(v)}" selected>(removed plan)</option>` : ''}${list.map(o => `<option value="${o.id}" ${String(o.id) === v ? 'selected' : ''}>${escapeHtml(prodPlanLabel(o))}</option>`).join('')}</select>`;
  }
  if (f.type === 'pi' || f.type === 'fprod') {
    const L = prodParentLists(), list = f.type === 'pi' ? L.pis : L.products, known = list.some(o => String(o.id) === v);
    return `<select ${attr} class="${COA_INPUT}"><option value="">${f.type === 'pi' ? 'No PI' : 'Select finished product…'}</option>${v && !known ? `<option value="${escapeHtml(v)}" selected>(removed)</option>` : ''}${list.map(o => `<option value="${escapeHtml(String(o.id))}" ${String(o.id) === v ? 'selected' : ''}>${escapeHtml(o.label)}</option>`).join('')}</select>`;
  }
  const opts = f.type === 'style' ? styStyles.map(s => s.style) : f.type === 'buyer' ? biBuyers.map(b => b.name) : f.options;
  if (opts) {
    const all = v && !opts.includes(v) ? [v, ...opts] : opts;
    return `<select ${attr} class="${COA_INPUT}"><option value="">Select…</option>${all.map(o => `<option value="${escapeHtml(o)}" ${o === v ? 'selected' : ''}>${escapeHtml(o)}</option>`).join('')}</select>`;
  }
  if (prodIsNum(f)) return `<input ${attr} type="number" min="0" step="any" inputmode="decimal" value="${escapeHtml(v)}" class="${COA_INPUT} tabular" />`;
  if (f.type === 'date') return `<input ${attr} type="date" value="${escapeHtml(v)}" class="${COA_INPUT} tabular" />`;
  return `<input ${attr} type="text" autocomplete="off" value="${escapeHtml(v)}" placeholder="${escapeHtml(f.placeholder || '')}" class="${COA_INPUT}" />`;
}
function prodFieldHtml(f, val, attr) {
  return `<label class="block min-w-0${f.type === 'textarea' ? ' sm:col-span-2 lg:col-span-4' : ''}">${biLabel(f.label, { req: f.req })}${prodControl(f, val, attr)}</label>`;
}

/* ================= RECORD SCREENS: PLANNING, QUALITY CONTROL, DEFECT & REWORK, EFFICIENCY DATA, COST ================= */
const PROD_SCREENS = {
  planning: {
    noun: 'Production Plan', title: 'Production Plans', minW: 'min-w-[980px]',
    fields: [
      { k: 'piId', label: 'Select PI', type: 'pi', req: true },
      { k: 'planNo', label: 'Plan No.', type: 'text', req: true },
      { k: 'style', label: 'Style No.', type: 'style' },
      { k: 'order', label: 'Order No.', type: 'text' },
      { k: 'qty', label: 'Order Qty', type: 'number' },
      { k: 'section', label: 'Section / Line', type: 'text' },
      { k: 'cap', label: 'Daily Capacity', type: 'number' },
      { k: 'start', label: 'Start Date', type: 'date' },
      { k: 'end', label: 'End Date', type: 'date' },
      { k: 'delivery', label: 'Delivery Date', type: 'date' },
      { k: 'remarks', label: 'Remarks', type: 'textarea' },
    ],
    cols: ['planNo', 'piId', 'style', 'order', 'qty', 'section', 'cap', 'start', 'end', 'delivery'],
    computed: [{ label: 'Days Needed', formula: 'order qty ÷ daily capacity, rounded up', fmt: 'int',
      fn: r => prodN(r.qty) > 0 && prodN(r.cap) > 0 ? Math.ceil(prodN(r.qty) / prodN(r.cap)) : null }],
    validate: v => (v.start && v.end && v.end < v.start ? 'End date can’t be before the start date.' : ''),
  },
  qc: {
    noun: 'Inspection', title: 'Inspections', minW: 'min-w-[960px]',
    fields: [
      { k: 'date', label: 'Date', type: 'date', req: true },
      { k: 'stage', label: 'Stage', type: 'select', options: PROD_STAGE_NAMES, req: true },
      { k: 'piId', label: 'PI No.', type: 'pi' },
      { k: 'line', label: 'Production Line', type: 'text' },
      { k: 'shift', label: 'Shift', type: 'select', options: ['Morning', 'Evening', 'Night'] },
      { k: 'buyer', label: 'Buyer', type: 'buyer' },
      { k: 'style', label: 'Style No.', type: 'style', req: true },
      { k: 'order', label: 'Order No.', type: 'text' },
      { k: 'lot', label: 'Lot / Batch No.', type: 'text' },
      { k: 'inspector', label: 'Inspector', type: 'text', req: true },
      { k: 'inspectionType', label: 'Inspection Type', type: 'select', options: ['In-line', 'End-line', 'Final'], req: true },
      { k: 'inspected', label: 'Inspected Qty', type: 'number', req: true },
      { k: 'passed', label: 'Passed Qty', type: 'number', req: true },
      { k: 'rework', label: 'Rework Qty', type: 'number' },
      { k: 'rejected', label: 'Rejected Qty', type: 'number' },
      { k: 'defect', label: 'Defect Category', type: 'select', options: ['None', 'Measurement', 'Stitching', 'Fabric', 'Color / shade', 'Finishing', 'Other'] },
      { k: 'disposition', label: 'Disposition', type: 'select', options: ['Accepted', 'Rework required', 'Rejected', 'On hold'], pill: true },
      { k: 'remarks', label: 'Remarks', type: 'textarea' },
    ],
    cols: ['date', 'stage', 'piId', 'style', 'inspectionType', 'inspected', 'passed', 'rework', 'rejected', 'disposition'],
    computed: [
      { label: 'Failed Qty', formula: 'inspected − passed', fmt: 'int', formOnly: true,
        fn: r => prodHas(r.inspected) && prodHas(r.passed) ? Math.max(0, prodN(r.inspected) - prodN(r.passed)) : null },
      { label: 'Unaccounted Qty', formula: 'inspected − passed − rework − rejected', fmt: 'int', formOnly: true,
        fn: r => prodHas(r.inspected) && prodHas(r.passed) ? Math.max(0, prodN(r.inspected) - prodN(r.passed) - prodN(r.rework) - prodN(r.rejected)) : null },
      { label: 'Pass Rate', formula: 'passed ÷ inspected × 100', fmt: 'pct',
        fn: r => prodN(r.inspected) > 0 && prodHas(r.passed) ? prodN(r.passed) / prodN(r.inspected) * 100 : null },
    ],
    validate: v => {
      if (prodHas(v.inspected) && prodN(v.inspected) <= 0) return 'Inspected qty must be greater than zero.';
      if (prodHas(v.inspected) && prodHas(v.passed) && prodN(v.passed) > prodN(v.inspected)) return 'Passed qty can’t be more than inspected qty.';
      if (prodHas(v.inspected) && prodN(v.passed) + prodN(v.rework) + prodN(v.rejected) > prodN(v.inspected)) return 'Passed, rework and rejected quantities exceed inspected qty.';
      return '';
    },
  },
  defect: {
    noun: 'Defect Record', title: 'Defect Records', minW: 'min-w-[940px]',
    fields: [
      { k: 'date', label: 'Date', type: 'date', req: true },
      { k: 'stage', label: 'Stage', type: 'select', options: PROD_STAGE_NAMES },
      { k: 'style', label: 'Style No.', type: 'style', req: true },
      { k: 'order', label: 'Order No.', type: 'text' },
      { k: 'type', label: 'Defect Type', type: 'text' },
      { k: 'defect', label: 'Defect Qty', type: 'number' },
      { k: 'reworked', label: 'Reworked Qty', type: 'number' },
      { k: 'status', label: 'Rework Status', type: 'select', options: ['Pending', 'In progress', 'Completed'], pill: true },
      { k: 'remarks', label: 'Remarks', type: 'textarea' },
    ],
    cols: ['date', 'stage', 'style', 'order', 'type', 'defect', 'reworked', 'status'],
    computed: [{ label: 'Pending Rework', formula: 'defect qty − reworked qty', fmt: 'int',
      fn: r => prodHas(r.defect) ? Math.max(0, prodN(r.defect) - prodN(r.reworked)) : null }],
    validate: v => (prodHas(v.defect) && prodHas(v.reworked) && prodN(v.reworked) > prodN(v.defect) ? 'Reworked qty can’t be more than defect qty.' : ''),
  },
  kpi: {
    noun: 'Efficiency Entry', title: 'Efficiency Entries', minW: 'min-w-[900px]',
    fields: [
      { k: 'date', label: 'Date', type: 'date', req: true },
      { k: 'section', label: 'Section / Line', type: 'text', req: true },
      { k: 'style', label: 'Style No.', type: 'style' },
      { k: 'manpower', label: 'Manpower', type: 'number' },
      { k: 'hours', label: 'Working Hours', type: 'number' },
      { k: 'produced', label: 'Produced Qty', type: 'number' },
      { k: 'sam', label: 'SAM (min per piece)', type: 'number' },
      { k: 'remarks', label: 'Remarks', type: 'textarea' },
    ],
    cols: ['date', 'section', 'style', 'manpower', 'hours', 'produced', 'sam'],
    computed: [{ label: 'Efficiency', formula: 'produced × SAM ÷ (manpower × working hours × 60) × 100', fmt: 'pct',
      fn: r => prodN(r.manpower) > 0 && prodN(r.hours) > 0 && prodN(r.sam) > 0 && prodHas(r.produced) ? prodN(r.produced) * prodN(r.sam) / (prodN(r.manpower) * prodN(r.hours) * 60) * 100 : null }],
  },
  cost: {
    noun: 'Cost Entry', title: 'Cost Entries', minW: 'min-w-[760px]', total: 'amount',
    fields: [
      { k: 'date', label: 'Date', type: 'date', req: true },
      { k: 'ref', label: 'Style / Order No.', type: 'text' },
      { k: 'head', label: 'Cost Head', type: 'text', req: true },
      { k: 'amount', label: 'Amount (BDT)', type: 'money' },
      { k: 'remarks', label: 'Remarks', type: 'textarea' },
    ],
    cols: ['date', 'ref', 'head', 'amount', 'remarks'],
    computed: [],
  },
};

const prodRecords = { planning: [], qc: [], defect: [], kpi: [], cost: [] };

const prodUi = {};
function prodBlank(key) { const v = {}; PROD_SCREENS[key].fields.forEach(f => { v[f.k] = f.k === 'date' ? prodToday() : f.k === 'planNo' && key === 'planning' ? prodNextPlanNo() : ''; }); return v; }
function prodNextPlanNo() { const n = prodRecords.planning.reduce((m, r) => Math.max(m, parseInt(String(r.planNo || '').split('-')[1], 10) || 0), 0) + 1; return 'PLN-' + String(n).padStart(4, '0'); }
function prodUiFor(key) { return prodUi[key] || (prodUi[key] = { editId: null, v: prodBlank(key), msg: '', tone: 'muted', q: '' }); }
function prodFormValues(key, row) { const v = {}; PROD_SCREENS[key].fields.forEach(f => { v[f.k] = row[f.k] == null ? '' : String(row[f.k]); }); return v; }
function prodCompText(c, v) { return v == null || !isFinite(v) ? '—' : c.fmt === 'pct' ? prodPct(v) : prodFmt(v); }
function prodSetMsg(key, text, tone) {
  const u = prodUiFor(key);
  u.msg = text || ''; u.tone = tone || 'muted';
  const el = document.getElementById('prodFormMsg');
  if (el) { el.textContent = u.msg; el.className = prodMsgClass(u.msg, u.tone); }
}
function prodValidate(key, v) {
  const sc = PROD_SCREENS[key];
  for (const f of sc.fields) {
    const val = String(v[f.k] == null ? '' : v[f.k]).trim();
    if (f.req && !val) return `${f.label} is required.`;
    if (prodIsNum(f) && val !== '' && (!isFinite(parseFloat(val)) || parseFloat(val) < 0)) return `${f.label} must be 0 or more.`;
  }
  return sc.validate ? sc.validate(v) : '';
}

function prodFormCard(key) {
  const sc = PROD_SCREENS[key], u = prodUiFor(key);
  const main = sc.fields.filter(f => f.type !== 'textarea'), wide = sc.fields.filter(f => f.type === 'textarea');
  const comp = sc.computed.map((c, i) => `<label class="block min-w-0">${biLabel(c.label)}<input type="text" readonly data-prodcomp="${i}" value="${escapeHtml(prodCompText(c, c.fn(u.v)))}" class="${COA_AUTO} tabular" /></label>`).join('');
  return `
    <section id="prodFormCard" class="bg-cardBg border border-side-panel rounded-lg card-shadow p-5">
      <div class="flex items-center justify-between gap-3 mb-3.5">
        <h3 class="text-section-title text-primary">${u.editId ? 'Edit' : 'New'} ${escapeHtml(sc.noun)}</h3>
        <p class="text-helper text-muted"><span class="text-danger">*</span> Required</p>
      </div>
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-x-3 gap-y-3.5">
        ${main.map(f => prodFieldHtml(f, u.v[f.k], `data-prodf="${f.k}"`)).join('')}
        ${comp}
        ${wide.map(f => prodFieldHtml(f, u.v[f.k], `data-prodf="${f.k}"`)).join('')}
      </div>
      ${sc.computed.length ? `<p class="text-helper text-muted mt-3">${sc.computed.map(c => `${escapeHtml(c.label)} = ${escapeHtml(c.formula)}`).join(' · ')}</p>` : ''}
      <div class="flex items-center justify-end gap-3 mt-4">
        <p id="prodFormMsg" class="${prodMsgClass(u.msg, u.tone)}">${escapeHtml(u.msg)}</p>
        ${u.editId ? `<button type="button" id="prodCancelBtn" class="${COA_BTN}">Cancel</button>` : ''}
        <button type="button" id="prodResetBtn" class="${COA_BTN}">Reset</button>
        <button type="button" id="prodSaveBtn" class="${COA_BTN_PRIMARY}">${BI_SAVE_ICON}${u.editId ? 'Update' : 'Save'} ${escapeHtml(sc.noun)}</button>
      </div>
    </section>`;
}
function prodFiltered(key) {
  const sc = PROD_SCREENS[key], q = prodUiFor(key).q.trim().toLowerCase();
  return prodRecords[key]
    .filter(r => !q || sc.fields.some(f => String(r[f.k] == null ? '' : r[f.k]).toLowerCase().includes(q)))
    .sort((a, b) => String(b.date || b.start || '').localeCompare(String(a.date || a.start || '')) || b.id - a.id);
}
function prodCounterText(key) { const n = prodRecords[key].length; return `${prodFiltered(key).length} of ${n} record${n === 1 ? '' : 's'}`; }
function prodResultsHtml(key) {
  const sc = PROD_SCREENS[key], rows = prodFiltered(key);
  const cols = sc.cols.map(k => sc.fields.find(f => f.k === k)), comps = sc.computed.filter(c => !c.formOnly);
  const heads = [...cols.map(f => [f.label, prodIsNum(f)]), ...comps.map(c => [c.label, true]), ['Actions', false]];
  const n = heads.length;
  const body = rows.length ? rows.map(r => {
    const cells = cols.map((f, i) => {
      const v = r[f.k];
      if (f.pill && v) return `<td class="px-3 py-2">${finPill(v, PROD_TONES[v] || 'neutral', true)}</td>`;
      const text = f.type === 'pi' ? (prodPiName(v) || '—') : v === '' || v == null ? '—' : f.type === 'money' ? coaMoney(prodN(v)) : f.type === 'number' ? prodFmt(v) : escapeHtml(v);
      const cls = [i === 0 ? 'pl-4 pr-2 font-medium text-primary' : 'px-3 text-secondary', prodIsNum(f) ? 'text-right' : '', prodIsNum(f) || f.type === 'date' ? 'tabular' : '', f.type === 'textarea' ? 'max-w-[240px] truncate' : 'whitespace-nowrap'].join(' ');
      return `<td class="${cls} py-2 fs-base"${f.type === 'textarea' && v ? ` title="${escapeHtml(v)}"` : ''}>${text}</td>`;
    }).join('') + comps.map(c => `<td class="px-3 py-2 fs-base font-medium text-primary text-right tabular whitespace-nowrap">${prodCompText(c, c.fn(r))}</td>`).join('');
    return `<tr class="border-b border-side-line last:border-b-0 hover:bg-side-hover">${cells}
      <td class="pr-4 pl-3 py-2 whitespace-nowrap"><button type="button" data-prod-edit="${r.id}" class="h-7 px-2.5 rounded border border-side-border text-secondary fs-small font-semibold hover:bg-side-hover mr-1.5">Edit</button><button type="button" data-prod-delete="${r.id}" class="h-7 px-2.5 rounded border border-side-border text-danger fs-small font-semibold hover:bg-side-hover">Delete</button></td>
    </tr>`;
  }).join('') : `<tr><td colspan="${n}" class="px-4 py-8 text-center fs-base text-muted">${prodRecords[key].length ? 'No records match the filter.' : 'No records yet. Fill in the form above and save the first one.'}</td></tr>`;
  let foot = '';
  if (sc.total && rows.length) {
    const sum = rows.reduce((s, r) => s + prodN(r[sc.total]), 0);
    foot = `<tfoot><tr class="border-t border-side-line bg-side-hover">${cols.map((f, i) => f.k === sc.total
      ? `<td class="px-3 py-2.5 fs-base font-semibold text-primary text-right tabular whitespace-nowrap">${coaMoney(sum)}</td>`
      : `<td class="${i === 0 ? 'pl-4 pr-2' : 'px-3'} py-2.5 fs-base font-semibold text-primary">${i === 0 ? 'Total' : ''}</td>`).join('')}<td></td></tr></tfoot>`;
  }
  return `
    <div class="overflow-x-auto border-t border-side-line">
      <table class="w-full ${sc.minW}">
        <thead><tr class="border-b border-side-line">${heads.map((h, i) => prodTh(h[0], i, n, h[1])).join('')}</tr></thead>
        <tbody>${body}</tbody>${foot}
      </table>
    </div>`;
}
function prodRecordsCard(key) {
  const sc = PROD_SCREENS[key];
  return `
    <section class="bg-cardBg border border-side-panel rounded-lg card-shadow">
      <div class="flex flex-wrap items-center justify-between gap-3 p-4">
        <div>
          <h3 class="text-section-title text-primary">${escapeHtml(sc.title)}</h3>
          <p id="prodCounter" class="text-helper text-muted">${prodCounterText(key)}</p>
        </div>
        <div class="relative w-full sm:w-72">${PROD_SEARCH_ICON}<input id="prodSearch" type="text" value="${escapeHtml(prodUiFor(key).q)}" placeholder="Filter records…" aria-label="Filter records" class="${COA_INPUT} pl-9" /></div>
      </div>
      <div id="prodResults">${prodResultsHtml(key)}</div>
    </section>`;
}
function prodTopHtml(key) { return key === 'qc' ? prodQcSummary() : key === 'kpi' ? prodKpiCards() : ''; }
function renderProdScreen(container, key) {
  const top = prodTopHtml(key);
  container.innerHTML = `
    <div class="space-y-4 pb-8">
      ${top ? `<div id="prodTop">${top}</div>` : ''}
      ${prodFormCard(key)}
      ${prodRecordsCard(key)}
    </div>`;
  prodBindScreen(container, key);
}
function prodRefreshResults(container, key) {
  container.querySelector('#prodResults').innerHTML = prodResultsHtml(key);
  container.querySelector('#prodCounter').textContent = prodCounterText(key);
  const top = container.querySelector('#prodTop');
  if (top) top.innerHTML = prodTopHtml(key);
}
function prodBindScreen(container, key) {
  const sc = PROD_SCREENS[key], u = prodUiFor(key), rerender = () => renderProdScreen(container, key);
  container.querySelectorAll('[data-prodf]').forEach(el => {
    const handler = () => {
      u.v[el.dataset.prodf] = el.value;
      sc.computed.forEach((c, i) => { const out = container.querySelector(`[data-prodcomp="${i}"]`); if (out) out.value = prodCompText(c, c.fn(u.v)); });
    };
    el.addEventListener('change', handler);
    if (el.tagName !== 'SELECT') el.addEventListener('input', handler);
  });
  container.querySelector('#prodResetBtn').addEventListener('click', () => {
    const row = u.editId ? prodRecords[key].find(r => r.id === u.editId) : null;
    u.v = row ? prodFormValues(key, row) : prodBlank(key); u.msg = '';
    rerender();
  });
  const cancel = container.querySelector('#prodCancelBtn');
  if (cancel) cancel.addEventListener('click', () => { u.editId = null; u.v = prodBlank(key); u.msg = ''; rerender(); });
  container.querySelector('#prodSaveBtn').addEventListener('click', () => {
    const err = prodValidate(key, u.v);
    if (err) return prodSetMsg(key, err, 'danger');
    const rec = {};
    sc.fields.forEach(f => { rec[f.k] = String(u.v[f.k] == null ? '' : u.v[f.k]).trim(); });
    const list = prodRecords[key], wasEdit = !!u.editId;
    if (wasEdit) Object.assign(list.find(r => r.id === u.editId), rec);
    else list.push({ id: list.reduce((m, r) => Math.max(m, r.id), 0) + 1, ...rec });
    u.editId = null; u.v = prodBlank(key);
    rerender();
    prodPersist();
    prodSetMsg(key, `${sc.noun} ${wasEdit ? 'updated' : 'saved'}.`, 'success');
  });
  container.querySelector('#prodSearch').addEventListener('input', (e) => { u.q = e.target.value; prodRefreshResults(container, key); });
  container.querySelector('#prodResults').addEventListener('click', (e) => {
    const editBtn = e.target.closest('[data-prod-edit]');
    if (editBtn) {
      const row = prodRecords[key].find(r => r.id === +editBtn.dataset.prodEdit);
      if (row) { u.editId = row.id; u.v = prodFormValues(key, row); u.msg = ''; rerender(); container.querySelector('#prodFormCard').scrollIntoView({ block: 'start', behavior: 'smooth' }); }
      return;
    }
    const delBtn = e.target.closest('[data-prod-delete]');
    if (delBtn) {
      const id = +delBtn.dataset.prodDelete, idx = prodRecords[key].findIndex(r => r.id === id);
      if (idx > -1) {
        prodRecords[key].splice(idx, 1); prodPersist();
        if (u.editId === id) { u.editId = null; u.v = prodBlank(key); }
        rerender();
        prodSetMsg(key, `${sc.noun} deleted.`, 'muted');
      }
    }
  });
}

function prodQcSummary() {
  const rows = prodFiltered('qc'), t = k => rows.reduce((s, r) => s + prodN(r[k]), 0), inspected = t('inspected'), passed = t('passed');
  return `<div class="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-6 gap-4">

    const rec = { header, rows: d.rows.map(r => ({ ...r })) }, list = prodStageRecords[st.id], wasEdit = !!d.editId;
    let stockNote = '';
    if (st.id === 'delivery') {
      const prev = wasEdit ? list.find(r => r.id === d.editId) : null;
      rec.uid = (prev && prev.uid) || prodNewUid();
      const res = prodDeliverySync('save', rec);
      if (res && res.error) return prodStageSetMsg(st, res.error, 'danger');
      if (res && res.ok) stockNote = ' Finished Product stock updated.';
    }
    if (wasEdit) Object.assign(list.find(r => r.id === d.editId), rec);
    else list.push({ id: list.reduce((m, r) => Math.max(m, r.id), 0) + 1, ...rec });
    prodStageDrafts[st.id] = prodBlankDraft(); prodPersist();
    rerender();
    prodStageSetMsg(st, `Entry ${header.entryNo} ${wasEdit ? 'updated' : 'saved'}.${stockNote}`, 'success');
  });
  container.querySelector('#prodStageRecords').addEventListener('click', (e) => {
    const editBtn = e.target.closest('[data-prodst-edit]');
    if (editBtn) {
      const rec = prodStageRecords[st.id].find(r => r.id === +editBtn.dataset.prodstEdit);
      if (rec) {
        prodStageDrafts[st.id] = { editId: rec.id, header: { ...rec.header }, rows: rec.rows.map(r => ({ ...r })), msg: '', tone: 'muted' };
        rerender();
        container.querySelector('#prodStageForm').scrollIntoView({ block: 'start', behavior: 'smooth' });
      }
      return;
    }
    const delBtn = e.target.closest('[data-prodst-delete]');
    if (delBtn) {
      const id = +delBtn.dataset.prodstDelete, list = prodStageRecords[st.id], idx = list.findIndex(r => r.id === id);
      if (idx > -1) {
        if (st.id === 'delivery' && list[idx].uid) { const res = prodDeliverySync('delete', list[idx]); if (res && res.error) { prodStageSetMsg(st, res.error, 'danger'); return; } }
        list.splice(idx, 1); prodPersist();
        if (d.editId === id) prodStageDrafts[st.id] = prodBlankDraft();
        rerender();
        prodStageSetMsg(st, 'Production record deleted.', 'muted');
      }
    }
  });
}

/* ================= CHARTS (SHARED BY DAILY PRODUCTION AND EFFICIENCY & KPI › CHART) ================= */
function prodNiceScale(max) {
  const raw = max / 4, mag = Math.pow(10, Math.floor(Math.log10(raw))), n = raw / mag;
  const step = (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * mag;
  return { top: step * Math.ceil(max / step), step };
}
function prodShortNum(v) { return v >= 1e6 ? `${+(v / 1e6).toFixed(1)}M` : v >= 1e3 ? `${+(v / 1e3).toFixed(1)}k` : String(+v.toFixed(2)); }
function prodBarPath(x, y, w, h) {
  const r = Math.min(4, w / 2, h);
  return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`;
}
/* Grouped vertical bars: thin marks, 4px rounded data ends on the baseline, 2px gap between
   series, recessive grid. Each band is one hover target whose tooltip names every series. */
function prodBarChart(labels, series, opts) {
  opts = opts || {};
  const max = Math.max(0, ...series.flatMap(s => s.values));
  if (!labels.length || max <= 0) return `<div class="h-[220px] flex items-center justify-center text-center fs-base text-muted px-4">${escapeHtml(opts.empty || 'No data for the selected filters.')}</div>`;
  const W = 520, H = 230, L = 44, R = 6, T = 22, B = 30, iw = W - L - R, ih = H - T - B;
  const { top, step } = prodNiceScale(max);
  let g = '';
  for (let v = 0; v <= top + step / 1000; v += step) {
    const y = T + ih * (1 - v / top);
    g += `<line x1="${L}" x2="${W - R}" y1="${y}" y2="${y}" stroke="var(--border-inner)" stroke-width="1"/><text x="${L - 8}" y="${y + 4}" text-anchor="end" font-size="13" fill="var(--text-muted)">${prodShortNum(v)}</text>`;
  }
  const band = iw / labels.length, n = series.length, gap = 2;
  const bw = Math.max(4, Math.min(24, (band * 0.62 - gap * (n - 1)) / n)), groupW = bw * n + gap * (n - 1);
  const every = Math.max(1, Math.ceil(labels.length / Math.max(1, Math.floor(iw / 58))));
  labels.forEach((lab, i) => {
    const x0 = L + band * i + (band - groupW) / 2;
    g += `<g><title>${escapeHtml(`${lab}: ${series.map(s => `${s.name} ${prodFmt(s.values[i])}`).join(', ')}`)}</title><rect x="${L + band * i}" y="${T}" width="${band}" height="${ih}" fill="transparent"/>`;
    series.forEach((s, j) => {
      const v = s.values[i] || 0, h = ih * v / top, x = x0 + j * (bw + gap);
      if (h > 0) g += `<path d="${prodBarPath(x, T + ih - h, bw, h)}" fill="var(${s.color})"/>`;
      if (opts.values && v > 0) g += `<text x="${x + bw / 2}" y="${T + ih - h - 6}" text-anchor="middle" font-size="13" font-weight="600" fill="var(--text-secondary)">${prodFmt(v)}</text>`;
    });
    g += '</g>';
    if (i % every === 0) g += `<text x="${L + band * (i + 0.5)}" y="${H - 9}" text-anchor="middle" font-size="13" fill="var(--text-muted)">${escapeHtml(lab)}</text>`;
  });
  g += `<line x1="${L}" x2="${W - R}" y1="${T + ih}" y2="${T + ih}" stroke="var(--border)" stroke-width="1"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" class="w-full h-auto" role="img" aria-label="${escapeHtml(opts.label || 'Bar chart')}">${g}</svg>`;
}
function prodLegend(items) {
  return `<div class="flex flex-wrap items-center gap-3">${items.map(([name, color]) => `<span class="inline-flex items-center gap-1.5 text-helper text-secondary"><span class="w-2.5 h-2.5 rounded-sm shrink-0" style="background:var(${color})"></span>${escapeHtml(name)}</span>`).join('')}</div>`;
}

/* ================= DAILY PRODUCTION (REPORT BUILT FROM THE STAGE ENTRIES) ================= */
const prodDrFilter = { date: prodToday(), buyer: '', style: '', q: '', zero: true };
function prodReportRows() {
  const sel = prodDrFilter.date || prodToday(), groups = {};
  PROD_STAGES.forEach((st, si) => prodStageRecords[st.id].forEach(rec => {
    const h = rec.header || {};
    if (!h.date || h.date > sel) return;
    const key = `${h.styleNo}||${h.orderNo}`;
    const g = groups[key] || (groups[key] = { style: h.styleNo || '—', order: h.orderNo || '—', buyer: '', gauge: '', ship: '', qty: 0, yarnReq: 0, yarnRec: 0, yarnDate: '', machines: new Set(), stages: PROD_STAGES.map(() => ({ today: 0, total: 0 })) });
    if (h.buyer && !g.buyer) g.buyer = h.buyer;
    if (h.shippingDate && !g.ship) g.ship = h.shippingDate;
    g.qty = Math.max(g.qty, prodN(h.orderQuantity));
    if (st.id === 'knitting') {
      if (h.gauge && !g.gauge) g.gauge = h.gauge;
      if (h.date >= g.yarnDate) { g.yarnDate = h.date; g.yarnReq = prodN(h.yarnReq); g.yarnRec = prodYarnRec(h); }
      if (h.date === sel && h.machineNo) g.machines.add(h.machineNo);
    }
    const produced = prodStageSums(st.id, rec).produced;
    g.stages[si].total += produced;
    if (h.date === sel) g.stages[si].today += produced;
  }));
  return Object.values(groups).map(g => ({
    ...g, buyer: g.buyer || '—', yarnRem: Math.max(0, g.yarnReq - g.yarnRec),
    stages: g.stages.map(s => ({ ...s, balance: Math.max(0, g.qty - s.total) })),
  })).sort((a, b) => a.style.localeCompare(b.style) || a.order.localeCompare(b.order));
}

function prodKpiCards() {

      <section class="bg-cardBg border border-side-panel rounded-lg card-shadow p-4 flex flex-wrap items-center gap-4"><div><p class="text-helper text-muted">Today</p><h2 class="fs-title font-semibold text-primary" id="dashDate"></h2></div><div class="ml-auto fs-title font-semibold tabular text-primary" id="dashTime"></div></section>
      ${sec('wc', 'World clocks', 'Local time and exchange rate to BDT for your buyers’ cities', `<div class="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-6 gap-3" id="dashClocks">${clocks}</div>`)}
      ${sec('kpi', 'Key numbers', 'Click a card to open its page', `<div class="grid grid-cols-2 lg:grid-cols-3 xl:grid-cols-5 gap-3">${kpis}</div>`)}
      <div class="grid grid-cols-1 xl:grid-cols-3 gap-4">
        <div class="xl:col-span-2">${sec('', 'Purchase vs Sales Overview', 'Last 12 months from orders and purchases', `<div class="flex flex-wrap items-center gap-4 mb-2"><span class="inline-flex items-center gap-1.5 fs-small text-secondary"><i class="w-2.5 h-2.5 rounded-sm" style="background:var(--warning)"></i>Purchase</span><span class="inline-flex items-center gap-1.5 fs-small text-secondary"><i class="w-2.5 h-2.5 rounded-sm" style="background:var(--accent)"></i>Sales</span></div><div id="lineChart">${lineChartSvg(X, +DASH.range)}</div>`, `<select id="range" class="${UI_INPUT} w-auto" aria-label="Range">${[1, 3, 6, 9, 12].map(n => `<option value="${n}" ${String(n) === String(DASH.range) ? 'selected' : ''}>Last ${n} Month${n > 1 ? 's' : ''}</option>`).join('')}</select>`)}</div>
        ${sec('', 'Order Status', 'Orders by stage', `<div class="mb-3"><select id="piSel" class="${UI_INPUT}" aria-label="PI filter"><option value="">All PIs combined</option>${DATA.pis.filter(r => r.status !== 'Cancelled').map(p => `<option value="${escapeHtml(p.id)}" ${DASH.pi === p.id ? 'selected' : ''}>${escapeHtml(p.code)}${p.buyer ? ' · ' + escapeHtml(p.buyer) : ''}</option>`).join('')}</select></div><div class="flex items-center gap-4"><div id="donutBox">${donutSvg(X)}</div><ul class="space-y-1.5 fs-head">${X.donut.map(([n, v, col]) => `<li class="flex items-center gap-2"><i class="w-2.5 h-2.5 rounded-sm" style="background:var(${col})"></i><span class="text-secondary">${n}</span><b class="ml-auto tabular">${v}</b><span class="text-muted tabular w-10 text-right">${X.total ? Math.round(v / X.total * 100) : 0}%</span></li>`).join('')}</ul></div>`)}
      </div>
      ${sec('qa', 'Quick Actions', 'Jump straight to the pages you use most', `<div class="grid grid-cols-2 md:grid-cols-4 gap-2.5">${qa}</div>`)}
      <div class="grid grid-cols-1 xl:grid-cols-3 gap-4"><div class="xl:col-span-2"><section class="bg-cardBg border border-side-panel rounded-lg card-shadow"><div class="p-4"><h3 class="fs-lead font-semibold text-primary">Recent Purchases &amp; Shipments / Export</h3></div><div class="overflow-x-auto border-t border-side-line"><table class="w-full min-w-[720px]" id="rtTable"><thead><tr class="border-b border-side-line">${['Type', 'Ref.', 'Party', 'Details', 'Amount', 'Status', 'Date'].map((h, i) => `<th class="${TH(i, 7, i === 4 ? 'right' : 'left')}">${h}</th>`).join('')}</tr></thead><tbody>${recent.slice(0, 12).map(r => `<tr class="border-b border-side-line last:border-b-0 cursor-pointer hover:bg-side-hover" data-gok="${r.go}">${r.cells.map((c, i) => `<td class="${TD(i, 7)}${i === 4 ? ' text-right tabular' : ''}">${c}</td>`).join('')}</tr>`).join('') || `<tr><td colspan="7" class="px-4 py-8 text-center text-body text-muted">No purchases, shipments or export orders yet.</td></tr>`}</tbody></table></div></section></div>
        <section class="bg-cardBg border border-side-panel rounded-lg card-shadow"><div class="p-4"><h3 class="fs-lead font-semibold text-primary">Payment Notifications</h3></div><ul class="border-t border-side-line max-h-[420px] overflow-y-auto" id="ntf">${N.map(n => `<li class="flex items-start gap-2 px-4 py-2.5 border-b border-side-line last:border-b-0 cursor-pointer hover:bg-side-hover" data-gok="${n.go}"><div class="min-w-0"><b class="block fs-head text-primary">${escapeHtml(n.t)}</b><small class="text-muted">${escapeHtml(n.s)}</small></div><time class="ml-auto shrink-0 fs-small ${n.time.includes('overdue') ? 'text-danger' : 'text-muted'}">${n.time}</time></li>`).join('') || '<li class="px-4 py-8 text-center text-body text-muted">No pending payments.</li>'}</ul></section></div>
      ${sec('', 'Inventory setting', 'Applies until the page is reloaded', `<label class="flex items-center gap-2 fs-head text-primary"><input type="checkbox" id="negStock" ${PREF.negStock ? 'checked' : ''}>Allow negative stock (stock may go below zero when moving or packing goods)</label>`)}</div>`;
    this.tickDate(); this.tickClocks(); this.paintBell(N.length);
    if (!DASH.tick) DASH.tick = setInterval(() => { if (!document.getElementById('dashClocks')) { clearInterval(DASH.tick); DASH.tick = null; return; } DASH_SCREEN.tickDate(); DASH_SCREEN.tickClocks(); }, 1000);
    if (!DASH.rates || Date.now() - DASH.fxAt > 36e5) this.loadFx();
  },
  paintBell(n) { const el = document.getElementById('bellBadge'); if (el) { el.textContent = n; el.classList.toggle('hidden', !n); } },
  tickDate() { const d = new Date(), a = document.getElementById('dashDate'), t = document.getElementById('dashTime'); if (a) a.textContent = d.toLocaleDateString('en-GB', { weekday:'long', day:'numeric', month:'long', year:'numeric' }); if (t) t.textContent = d.toLocaleTimeString('en-US', { hour:'2-digit', minute:'2-digit' }); },
  tickClocks() { const now = new Date(); DASH.wc.map(dashCity).filter(Boolean).forEach(c => { const e = document.getElementById('wc_' + c.id); if (!e) return; const P = {}; try { new Intl.DateTimeFormat('en-GB', { timeZone:c.tz, hour12:true, hour:'2-digit', minute:'2-digit', day:'2-digit', month:'2-digit', year:'numeric', weekday:'long' }).formatToParts(now).forEach(p => { P[p.type] = p.value; }); } catch (err) { return; } const q = s => e.querySelector(s); q('[data-h]').textContent = P.hour; q('[data-m]').textContent = P.minute; q('[data-ap]').textContent = (P.dayPeriod || '').toUpperCase(); q('[data-dt]').textContent = `${P.day}/${P.month}/${P.year}`; q('[data-wd]').textContent = P.weekday; }); },
  paintRates() { if (!DASH.rates) return; DASH.wc.map(dashCity).filter(Boolean).forEach(c => { const e = document.getElementById('wc_' + c.id), r = e && e.querySelector('[data-r]'); if (r) { const v = DASH.rates[c.cur]; r.textContent = v ? v.toFixed(2) : '—'; } }); },
  async loadFx() {
    if (typeof fetch !== 'function') return;
    const gj = async u => { const ac = new AbortController(), tm = setTimeout(() => ac.abort(), 10000); try { const r = await fetch(u, { signal:ac.signal, cache:'no-store' }); if (!r.ok) throw 0; return await r.json(); } finally { clearTimeout(tm); } };
    const up = j => { const u = {}; Object.keys(j.usd).forEach(k => { u[k.toUpperCase()] = j.usd[k]; }); if (!u.BDT) throw 0; return u; };
    const SRC = [async () => { const j = await gj('https://open.er-api.com/v6/latest/USD'); if (!j.rates || !j.rates.BDT) throw 0; return j.rates; }, async () => up(await gj('https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/usd.json')), async () => up(await gj('https://latest.currency-api.pages.dev/v1/currencies/usd.json'))];
    for (const s of SRC) { try { const u = await s(), r = {}; DASH_CITIES.forEach(c => { if (c.cur !== 'BDT' && u[c.cur]) r[c.cur] = u.BDT / u[c.cur]; }); DASH.rates = r; DASH.fxAt = Date.now(); this.paintRates(); return; } catch (e) { /* try the next source */ } }
    DASH.fxAt = Date.now(); if (!DASH.rates) { DASH.rates = {}; this.paintRates(); }
  },
  onInput() {},
  onChange(e) {
    if (e.target.id === 'range') { DASH.range = e.target.value; this.q('#lineChart').innerHTML = lineChartSvg(dashSync(), +DASH.range); }
    else if (e.target.id === 'negStock') { PREF.negStock = e.target.checked; toast(PREF.negStock ? 'Negative stock allowed.' : 'Negative stock not allowed.'); }
    else if (e.target.id === 'piSel') { DASH.pi = e.target.value; this.render(); }
  },
  onClick(e) {
    const rmB = e.target.closest('[data-rm]');
    if (rmB) { e.stopPropagation(); const [k, id] = rmB.dataset.rm.split(':'); DASH[k] = DASH[k].filter(x => x !== id); this.render(); return true; }
    const ad = e.target.closest('[data-add]');
    if (ad) {
      const k = ad.dataset.add, nm = { wc:'city', kpi:'KPI card', qa:'quick action' }[k];
      if (DASH[k].length >= DASH_LIM[k]) { toast(`Maximum ${DASH_LIM[k]} ${k === 'wc' ? 'cities' : nm + 's'}. Remove one first.`, 'danger'); return true; }
      const items = k === 'wc' ? DASH_CITIES.map(c => ({ id:c.id, l:c.city, s:c.cur, used:DASH.wc.includes(c.id) })) : k === 'kpi' ? DASH_KP.map(x => ({ id:x.id, l:x.l, s:'', used:DASH.kpi.includes(x.id) })) : dashQaCat().map(x => ({ id:x.id, l:x.l, s:x.g, used:DASH.qa.includes(x.id) }));
      dashPick(k === 'wc' ? 'Add city' : k === 'kpi' ? 'Add KPI card' : 'Add quick action', k === 'wc' ? 'Search a city name. Up to 6 cities.' : k === 'kpi' ? 'Choose from 12 presets. Up to 5 cards.' : 'Choose from your sub-modules. Up to 8 actions.', items, id => { DASH[k].push(id); this.render(); });
      return true;
    }
    const ed = e.target.closest('[data-edit]'); if (ed) { DASH.edit[ed.dataset.edit] = !DASH.edit[ed.dataset.edit]; this.render(); return true; }
    const qa = e.target.closest('[data-qa]');
    if (qa) { const a = dashQaCat().find(x => x.id === qa.dataset.qa); if (a) { goTo(a.mk, a.si); if (DASH_NEW[a.l]) setTimeout(DASH_NEW[a.l], 0); } return true; }
    const go = e.target.closest('[data-gok]'); if (go) { dashGo(go.dataset.gok); return true; }
    return false;
  },
};
const PI_CLS_SAFE = s => ({ Pending:'s-pending', 'In Progress':'s-inprogress', Paid:'s-confirmed', Delivered:'s-delivered', Shipped:'s-shipped', 'In Transit':'s-shipped', 'Customs Clearance':'s-inprogress', Received:'s-delivered', Ordered:'neutral', Unpaid:'s-pending', Confirmed:'s-confirmed', 'Partially Paid':'s-inprogress', Cancelled:'neutral' }[s] || 'neutral');
function dashPick(title, hint, items, onPick) {
  const draw = (root, q) => { root.querySelector('ul').innerHTML = items.filter(x => !q || (x.l + ' ' + (x.s || '')).toLowerCase().includes(q)).map(x => `<li data-id="${escapeHtml(x.id)}" class="flex items-center gap-2 px-3 py-2 rounded ${x.used ? 'text-muted' : 'cursor-pointer hover:bg-side-hover'}"><b class="fs-head">${escapeHtml(x.l)}</b><small class="ml-auto text-muted">${escapeHtml(x.used ? 'Added' : x.s || '')}</small></li>`).join('') || '<li class="px-3 py-2 text-muted">No match</li>'; };
  const root = openPanel({ id:'catPDashPick', title, icon:'grid', width:'max-w-[480px]', body:`<p class="fs-head text-muted mb-2">${escapeHtml(hint)}</p><input type="search" placeholder="Search…" aria-label="Search" class="${UI_INPUT} mb-2"><ul class="max-h-[50vh] overflow-y-auto"></ul>`, footer:`<button type="button" class="${UI_BTN}" data-pclose>Close</button>`,
    onInput: (e, r) => draw(r, e.target.value.trim().toLowerCase()), onClick: e => { const li = e.target.closest('li[data-id]'); if (li && !li.classList.contains('text-muted')) { closePanel('catPDashPick'); onPick(li.dataset.id); } } });
  draw(root, '');
}
SCREENS['dashboard/Dashboard'] = el => showModule(DASH_SCREEN, el);

renderNav();
