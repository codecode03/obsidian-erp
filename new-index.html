<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'] },
        colors: {
          primary: 'var(--text-primary)',
          secondary: 'var(--text-secondary)',
          muted: 'var(--text-muted)',
          disabled: 'var(--text-disabled)',
          side: {
            bg: 'var(--surface)',
            hover: 'var(--hover)',
            active: 'var(--active-tint)',
            border: 'var(--border)',
            panel: 'var(--border-panel)',
            line: 'var(--border-inner)',
            text: 'var(--text-secondary)',
            textbright: 'var(--text-primary)',
            accent: 'var(--accent)',
            accentHover: 'var(--accent-hover)',
            accentLight: 'var(--accent-light)',
            navActiveBg: 'var(--nav-active-bg)',
            navActiveText: 'var(--nav-active-text)',
            navSubActiveBg: 'var(--nav-sub-active-bg)',
            navSubActiveText: 'var(--nav-sub-active-text)',
            navSubActiveDot: 'var(--nav-sub-active-dot)',
            navHoverBg: 'var(--nav-hover-bg)',
            navHoverText: 'var(--nav-hover-text)',
            navText: 'var(--nav-text)',
            navSubText: 'var(--nav-sub-text)',
            navDot: 'var(--nav-dot)',
          },
          canvas: 'var(--bg)',
          cardBg: 'var(--card-bg)',
          success: 'var(--success)',
          warning: 'var(--warning)',
          danger: 'var(--danger)',
          info: 'var(--info)',
          neutral: 'var(--neutral)',
          violet: 'var(--violet)',
          successSoft: 'var(--success-soft)',
          warningSoft: 'var(--warning-soft)',
          dangerSoft: 'var(--danger-soft)',
          infoSoft: 'var(--info-soft)',
          neutralSoft: 'var(--neutral-soft)',
          violetSoft: 'var(--violet-soft)',
        },
        /* Tight enterprise radius scale — 4 / 6 / 8 / 10, nothing larger. */
        borderRadius: {
          none: '0',
          xs: 'var(--r-xs)',
          sm: 'var(--r-sm)',
          DEFAULT: 'var(--r-sm)',
          md: 'var(--r-md)',
          lg: 'var(--r-lg)',
          full: '9999px',
        },
      }
    }
  }
</script>
<style>
  /* ================================================================
     Theme tokens — sourced from ERP_Color.html (Obsidian ERP Color System)
     ================================================================ */
  :root,
  html[data-theme="light"] {
    color-scheme: light;   /* native controls (date picker) follow the theme */
    --bg: #EAEFEE;
    --surface: #F1F3F4;
    --card-bg: #F7F9F8;
    --hover: #E1E5E8;
    --active-tint: rgba(13, 148, 136, 0.09);   /* selected row / list option */
    --border: #AEB5BB;                       /* controls only: inputs, selects, tables */
    --border-panel: rgba(16, 21, 27, 0.07);  /* panels lean on fill + shadow */
    --border-inner: #E2E8F0;

    --text-primary: #10151B;
    --text-secondary: #3B4450;
    --text-muted: #5B6572;
    --text-disabled: #94A3B8;
    --text-inverse: #FFFFFF;

    --accent: #0D9488;
    --accent-hover: #0F766E;
    --accent-light: #D7F5F0;
    --accent-soft: #E6FFFB;
    --accent-ring: rgba(13, 148, 136, 0.28);

    --success: #16A34A;
    --warning: #F59E0B;
    --danger: #EF4444;
    --info: #3B82F6;
    --neutral: #64748B;
    --success-soft: #DCFCE7;
    --warning-soft: #FEF3C7;
    --danger-soft: #FEE2E2;
    --info-soft: #DBEAFE;
    --neutral-soft: #E2E8F0;
    --violet: #8B5CF6;
    --violet-soft: #EDE9FE;

    --nav-active-bg: #0D9488;       /* unchanged — solid brand fill */
    --nav-active-text: #FFFFFF;
    --nav-active-icon: #FFFFFF;
    --nav-active-border: transparent;
    --nav-sub-active-bg: #99F6E4;   /* teal-200: sits between the loud teal-300 and the invisible teal-50 */
    --nav-sub-active-text: #115E59;
    --nav-sub-active-dot: #0D9488;
    --nav-sub-active-bar: transparent;
    --nav-hover-bg: #E1E5E8;
    --nav-hover-text: #1F2937;
    --nav-text: #3B4450;
    --nav-sub-text: #4B5563;
    --nav-icon: #6B7480;
    --nav-dot: #9CA3AF;

    --chart-1: #0D9488; --chart-2: #3B82F6; --chart-3: #F59E0B; --chart-4: #EF4444; --chart-5: #8B5CF6;
    --chart-6: #06B6D4; --chart-7: #84CC16; --chart-8: #F97316; --chart-9: #EC4899; --chart-10: #64748B;

    --scrollbar-track: #E7E9EB;
    --scrollbar-thumb: #A8AEB5;
    --overlay: rgba(16, 21, 27, 0.45);
  }

  html[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0F172A;
    --surface: #141B2E;
    --card-bg: #1E293B;
    --hover: #273449;
    --active-tint: rgba(45, 212, 191, 0.13);   /* selected row / list option */
    --border: #334155;
    --border-panel: #334155;                 /* no usable shadow on dark, border does the work */
    --border-inner: #334155;

    --text-primary: #F8FAFC;
    --text-secondary: #CBD5E1;
    --text-muted: #94A3B8;
    --text-disabled: #64748B;
    --text-inverse: #0F172A;

    --accent: #2DD4BF;
    --accent-hover: #5EEAD4;
    --accent-light: #134E4A;
    --accent-soft: #0F766E;
    --accent-ring: rgba(45, 212, 191, 0.30);

    --success: #22C55E;
    --warning: #FBBF24;
    --danger: #F87171;
    --info: #60A5FA;
    --neutral: #94A3B8;
    --success-soft: rgba(34, 197, 94, 0.16);
    --warning-soft: rgba(251, 191, 36, 0.16);
    --danger-soft: rgba(248, 113, 113, 0.16);
    --info-soft: rgba(96, 165, 250, 0.16);
    --neutral-soft: rgba(148, 163, 184, 0.16);
    --violet: #A78BFA;
    --violet-soft: rgba(167, 139, 250, 0.18);

    --nav-active-bg: rgba(20, 184, 166, 0.15);
    --nav-active-text: #5EEAD4;
    --nav-active-icon: #5EEAD4;
    --nav-active-border: #2DD4BF;
    --nav-sub-active-bg: rgba(45, 212, 191, 0.22);
    --nav-sub-active-text: #99F6E4;
    --nav-sub-active-dot: #5EEAD4;
    --nav-sub-active-bar: transparent;
    --nav-hover-bg: #273449;
    --nav-hover-text: #F8FAFC;
    --nav-text: #CBD5E1;
    --nav-sub-text: #94A3B8;
    --nav-icon: #64748B;
    --nav-dot: #475569;

    --chart-1: #2DD4BF; --chart-2: #60A5FA; --chart-3: #FBBF24; --chart-4: #F87171; --chart-5: #A78BFA;
    --chart-6: #22D3EE; --chart-7: #A3E635; --chart-8: #FB923C; --chart-9: #F472B6; --chart-10: #94A3B8;

    --scrollbar-track: #1E293B;
    --scrollbar-thumb: #475569;
    --overlay: rgba(0, 0, 0, 0.6);
  }

  /* ---------- Radius scale ---------- */
  :root { --r-xs: 4px; --r-sm: 6px; --r-md: 8px; --r-lg: 10px; }

  /* ---------- Motion ---------- */
  :root { --ease: cubic-bezier(0.2, 0, 0, 1); --dur-fast: 120ms; --dur: 160ms; }

  /* Specific properties only — never `all`, which animates layout and janks. */
  button, a, input, .cmdk-row {
    transition: background-color var(--dur-fast) var(--ease),
                color var(--dur-fast) var(--ease),
                border-color var(--dur-fast) var(--ease),
                box-shadow var(--dur-fast) var(--ease);
  }
  body { transition: background-color var(--dur) var(--ease), color var(--dur) var(--ease); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
      scroll-behavior: auto !important;
    }
  }

  /* ---------- Focus ---------- */
  :where(button, a, [tabindex]):focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  :where(button, a, [tabindex]):focus:not(:focus-visible) { outline: none; }

  /* ---------- Scrollbars ---------- */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: var(--r-xs); }
  ::-webkit-scrollbar-track { background: var(--scrollbar-track); }

  #nav { scrollbar-width: thin; scrollbar-color: transparent transparent; }
  #nav::-webkit-scrollbar { width: 4px; }
  #nav::-webkit-scrollbar-track { background: transparent; }
  #nav::-webkit-scrollbar-thumb { background: transparent; border-radius: var(--r-xs); }
  #nav:hover { scrollbar-color: var(--scrollbar-thumb) transparent; }
  #nav:hover::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); }

  .submenu { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 200ms var(--ease); }
  .submenu.open { grid-template-rows: 1fr; }
  .submenu > div { overflow: hidden; }
  .chev { transition: transform 180ms var(--ease); }
  .chev.open { transform: rotate(180deg); }

  /* ---------- Elevation ---------- */
  .premium-shadow { box-shadow: 0 1px 3px rgba(16, 21, 27, 0.11), 0 1px 1px rgba(16, 21, 27, 0.05); }
  html[data-theme="dark"] .premium-shadow { box-shadow: 0 1px 2px rgba(0, 0, 0, 0.35), 0 1px 1px rgba(0, 0, 0, 0.25); }

  .card-shadow { box-shadow: 0 1px 3px rgba(16, 21, 27, 0.13), 0 4px 10px -4px rgba(16, 21, 27, 0.10); }
  html[data-theme="dark"] .card-shadow { box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4), 0 1px 2px rgba(0, 0, 0, 0.3); }

  .overlay-shadow { box-shadow: 0 16px 48px -12px rgba(16, 21, 27, 0.28), 0 4px 12px -4px rgba(16, 21, 27, 0.14); }
  html[data-theme="dark"] .overlay-shadow { box-shadow: 0 16px 48px -12px rgba(0, 0, 0, 0.7), 0 4px 12px -4px rgba(0, 0, 0, 0.5); }

  /* ---------- Typography scale ----------
     Large numbers get lighter weight + tighter tracking, not heavier weight.
     That is the difference between an enterprise figure and a marketing figure.
     Every font size in the app comes from these tokens, so one edit here resizes the whole UI.
     Nothing readable sits below 12px: this is a data-dense screen used all day by all ages. */
  :root {
    --fs-caps:  12px;    /* UPPERCASE labels: table headers, micro labels */
    --fs-small: 12.5px;  /* helper text, pills, small buttons */
    --fs-head:  13.5px;  /* column headings */
    --fs-base:  14px;    /* body, table cells, form fields, labels */
    --fs-lead:  15px;    /* dialog titles */
    --fs-title: 16px;    /* card titles, key totals */
  }
  .fs-caps  { font-size: var(--fs-caps); }
  .fs-small { font-size: var(--fs-small); }
  .fs-head  { font-size: var(--fs-head); }
  .fs-base  { font-size: var(--fs-base); }
  .fs-lead  { font-size: var(--fs-lead); }
  .fs-title { font-size: var(--fs-title); }

  .text-display       { font-size: 30px; line-height: 34px; font-weight: 600; letter-spacing: -0.025em; font-variant-numeric: tabular-nums; }
  .text-page-title    { font-size: 20px; line-height: 26px; font-weight: 600; letter-spacing: -0.02em; }
  .text-section-title { font-size: var(--fs-title); line-height: 22px; font-weight: 600; letter-spacing: -0.01em; }
  .text-body          { font-size: var(--fs-base); line-height: 21px; font-weight: 400; }
  .text-body-medium   { font-size: var(--fs-base); line-height: 21px; font-weight: 500; }
  .text-label         { font-size: var(--fs-base); line-height: 20px; font-weight: 500; }
  .text-table-header  { font-size: var(--fs-caps); line-height: 16px; font-weight: 600; letter-spacing: 0.045em; text-transform: uppercase; }
  .text-table-body    { font-size: var(--fs-base); line-height: 21px; font-weight: 400; font-variant-numeric: tabular-nums; }
  .text-helper        { font-size: var(--fs-small); line-height: 18px; font-weight: 400; }
  .text-micro         { font-size: var(--fs-caps); line-height: 14px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; }

  .num, input[type="number"], input[type="date"], .tabular { font-variant-numeric: tabular-nums; }
</style>

</head>

<script>

const icons = {

function setSidebarCollapsed(collapsed) {

function iconSvg(name, extraClass) {

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}

const NAV_ACTIVE_CLASS = 'bg-side-navActiveBg text-side-navActiveText font-semibold shadow-[inset_2px_0_0_0_var(--nav-active-border)]';
const NAV_IDLE_CLASS = 'font-medium text-side-navText hover:bg-side-navHoverBg hover:text-side-navHoverText';

function renderNav() {
  nav.innerHTML = '';

  // --- Modules ---
  modules.forEach(mod => {
    const isActive = state.moduleKey === mod.key;

    if (mod.submodules.length === 1) {
      const flatBtn = document.createElement('button');
      flatBtn.className = `w-full flex items-center gap-2.5 px-3 py-2 rounded-md text-label ${sidebarCollapsed ? 'justify-center' : ''} ${isActive ? NAV_ACTIVE_CLASS : NAV_IDLE_CLASS}`;
      if (sidebarCollapsed) flatBtn.title = mod.name;
      flatBtn.innerHTML = `${iconSvg(mod.icon, 'w-4 h-4 shrink-0')}${sidebarCollapsed ? '' : `<span class="flex-1 text-left">${escapeHtml(mod.name)}</span>`}`;
      flatBtn.addEventListener('click', () => goTo(mod.key, 0));
      nav.appendChild(flatBtn);
      return;
    }

    const isExpanded = !sidebarCollapsed && state.openKey === mod.key;

    const wrap = document.createElement('div');

    const btn = document.createElement('button');
    btn.className = `w-full flex items-center gap-2.5 px-3 py-2 rounded-md text-label ${sidebarCollapsed ? 'justify-center' : ''} ${isActive ? NAV_ACTIVE_CLASS : NAV_IDLE_CLASS}`;
    btn.setAttribute('aria-expanded', String(isExpanded));
    if (sidebarCollapsed) btn.title = mod.name;
    btn.innerHTML = sidebarCollapsed ? iconSvg(mod.icon, 'w-4 h-4 shrink-0') : `
      ${iconSvg(mod.icon, 'w-4 h-4 shrink-0')}
      <span class="flex-1 text-left">${escapeHtml(mod.name)}</span>
      <svg class="chev ${isExpanded ? 'open' : ''} w-3 h-3 shrink-0 opacity-70" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
    `;
    btn.addEventListener('click', () => {
      if (sidebarCollapsed) { state.openKey = mod.key; setSidebarCollapsed(false); return; }
      state.openKey = isExpanded ? null : mod.key;
      renderNav();
    });

    if (sidebarCollapsed) { wrap.appendChild(btn); nav.appendChild(wrap); return; }

    const sub = document.createElement('div');
    sub.className = `submenu ${isExpanded ? 'open' : ''}`;
    const subInner = document.createElement('div');
    const list = document.createElement('div');
    list.className = 'pt-0.5 pb-1 pl-[22px] flex flex-col gap-px';

    mod.submodules.forEach((sm, i) => {
      const active = isActive && state.subIndex === i;
      const item = document.createElement('button');
      item.className = `flex items-center gap-2 text-left px-2.5 py-1.5 fs-head rounded ${active ? 'bg-side-navSubActiveBg text-side-navSubActiveText font-semibold shadow-[inset_2px_0_0_0_var(--nav-sub-active-bar)]' : 'text-side-navSubText hover:bg-side-navHoverBg hover:text-side-navHoverText'}`;
      item.setAttribute('aria-current', active ? 'page' : 'false');
      item.innerHTML = `<span class="w-1 h-1 rounded-full shrink-0 ${active ? 'bg-side-navSubActiveDot' : 'bg-side-navDot'}"></span><span>${escapeHtml(sm.name)}</span>`;
      item.addEventListener('click', (e) => { e.stopPropagation(); goTo(mod.key, i); });
      list.appendChild(item);
    });

    subInner.appendChild(list);
    sub.appendChild(subInner);
    wrap.appendChild(btn);
    wrap.appendChild(sub);
    nav.appendChild(wrap);
  });
}

function sectionCard(title, action, innerHtml) {

function sparkline(points, colorVar) {
  const w = 68, h = 24, pad = 2;
  const max = Math.max(...points), min = Math.min(...points);
  const range = (max - min) || 1;
  const step = w / (points.length - 1);
  const d = points.map((p, i) => {
    const x = (i * step).toFixed(1);
    const y = (h - pad - ((p - min) / range) * (h - pad * 2)).toFixed(1);
    return `${i === 0 ? 'M' : 'L'}${x},${y}`;
  }).join(' ');
  return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" fill="none" preserveAspectRatio="none" aria-hidden="true" class="shrink-0">
    <path d="${d}" stroke="var(${colorVar})" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
  </svg>`;
}

function statCard(s) {
  const up = s.delta.startsWith('+');
  return `

/* Route DOM events of the visible page to the module that drew it. */
let ACTIVE_MOD = null;
function showModule(mod, container) { ACTIVE_MOD = mod; mod.render(container); }
['click', 'input', 'change'].forEach(type => {
  const h = e => {
    if (!ACTIVE_MOD) return;
    const inPage = e.target.closest('#page-content, #page-actions'); if (!inPage) return;
    if (type === 'click') ACTIVE_MOD.onClick(e);
    else if (type === 'input') ACTIVE_MOD.onInput(e);
    else ACTIVE_MOD.onChange(e);
  };
  document.addEventListener(type, h);
});

// ---------- Record modal (same look as finOpenModal; adds lines, live show/hide, footer sum) ----------
const optList = (o, arg, row) => (typeof o === 'function' ? o(arg, row) : o).map(x => typeof x === 'string' ? { v: x, l: x } : x);
function mHeading(text, id) { return `<div ${id ? `id="mw_${id}"` : ''} class="sm:col-span-2 pt-2 pb-1 border-b border-side-line fs-lead font-semibold text-primary">${escapeHtml(text)}</div>`; }
function fieldsHTML(c, row) {
  const fs = c.fields, real = fs.filter(f => f.t !== 'info' && f.t !== 'heading');
  if (fs.some(f => f.t === 'heading') || real.length < 9) return fs.map(f => fieldM(f, row)).join('');
  const buckets = FG_NAMES.map(() => []); let last = 0;
  fs.forEach(f => { const g = f.t === 'info' ? last : fgOf(f); last = g; buckets[g].push(f); });
  if (buckets.filter(b => b.length).length < 2) return fs.map(f => fieldM(f, row)).join('');
  return buckets.map((b, i) => b.length ? mHeading(FG_NAMES[i]) + b.map(f => fieldM(f, row)).join('') : '').join('');
}
function fieldM(f, row) {

  const v = row[f.k] ?? '', id = 'm_' + f.k, span = (f.full || f.wide) ? ' sm:col-span-2' : '';

  if (f.t === 'select') {
    inp = `<select id="${id}" data-k="${f.k}" class="${UI_INPUT}"><option value="">Select…</option>${optList(f.o, v, row).map(x => `<option value="${escapeHtml(x.v)}" ${x.v === v ? 'selected' : ''}>${escapeHtml(x.l)}</option>`).join('')}</select>`;
  } else if (f.t === 'textarea') {
    inp = `<textarea id="${id}" data-k="${f.k}" rows="${f.rows || 3}" placeholder="${escapeHtml(f.ph || '')}" class="${UI_INPUT} h-auto py-2 resize-none">${escapeHtml(v)}</textarea>`;

    inp = `<div class="flex items-center gap-2"><span id="m_file_${f.k}" class="fs-head text-muted truncate">${row[f.k + 'Name'] ? escapeHtml(row[f.k + 'Name']) : 'No file attached'}</span>

  }
  return `<label id="mw_${f.k}" class="block min-w-0${span}${hide}">${biLabel(f.l, { req: f.req })}${inp}<span class="block text-helper text-danger min-h-0" data-err></span></label>`;

const cmdk = document.getElementById('cmdk');
const cmdkInput = document.getElementById('cmdkInput');
const cmdkList = document.getElementById('cmdkList');
const cmdkCount = document.getElementById('cmdkCount');
let cmdkResults = [];
let cmdkCursor = 0;
let lastFocused = null;

function scoreEntry(e, q) {
  const i = e.hay.indexOf(q);
  if (i !== -1) return (i === 0 ? 1000 : e.hay[i - 1] === ' ' ? 800 : 500) - i;
  let qi = 0;                                   // subsequence fallback: "pom" -> "PrOduction Management"
  for (let c = 0; c < e.hay.length && qi < q.length; c++) if (e.hay[c] === q[qi]) qi++;
  return qi === q.length ? 100 - e.hay.length / 10 : -1;
}

function renderCmdkList() {
  if (!cmdkResults.length) {
    cmdkList.innerHTML = `<p class="px-4 py-6 text-center text-body text-muted">No screens match that search.</p>`;
    cmdkCount.textContent = '';
    return;
  }
  cmdkList.innerHTML = cmdkResults.map((e, i) => `
    <button role="option" aria-selected="${i === cmdkCursor}" data-i="${i}"
      class="cmdk-row w-full flex items-center gap-2.5 px-3.5 py-2 text-left ${i === cmdkCursor ? 'bg-side-hover' : ''}">
      ${iconSvg(e.icon, 'w-4 h-4 shrink-0 ' + (i === cmdkCursor ? 'text-side-accent' : 'text-muted'))}
      <span class="text-body-medium text-primary truncate">${escapeHtml(e.title)}</span>
      ${e.context ? `<span class="text-helper text-disabled truncate ml-auto shrink-0">${escapeHtml(e.context)}</span>` : ''}
    </button>
  `).join('');
  cmdkCount.textContent = `${cmdkResults.length} of ${pageIndex.length}`;
  cmdkList.querySelector('[aria-selected="true"]')?.scrollIntoView({ block: 'nearest' });
}

function updateCmdk() {
  const q = cmdkInput.value.trim().toLowerCase();
  cmdkResults = !q
    ? pageIndex.slice(0, 40)
    : pageIndex.map(e => ({ e, s: scoreEntry(e, q) })).filter(x => x.s >= 0)
        .sort((a, b) => b.s - a.s).slice(0, 40).map(x => x.e);
  cmdkCursor = 0;
  renderCmdkList();
}

function openCmdk() {
  lastFocused = document.activeElement;
  cmdk.classList.remove('hidden');
  cmdkInput.value = '';
  updateCmdk();
  cmdkInput.focus();
}

function closeCmdk() {
  cmdk.classList.add('hidden');
  if (lastFocused && document.contains(lastFocused)) lastFocused.focus();
}

function commitCmdk() {
  const pick = cmdkResults[cmdkCursor];
  if (!pick) return;
  closeCmdk();
  goTo(pick.moduleKey, pick.subIndex);
}

cmdkInput.addEventListener('input', updateCmdk);
document.getElementById('cmdkBackdrop').addEventListener('click', closeCmdk);
document.getElementById('searchTrigger').addEventListener('click', openCmdk);

cmdkList.addEventListener('mousemove', (e) => {
  const row = e.target.closest('[data-i]');
  if (row && +row.dataset.i !== cmdkCursor) { cmdkCursor = +row.dataset.i; renderCmdkList(); }
});
cmdkList.addEventListener('click', (e) => {
  const row = e.target.closest('[data-i]');
  if (row) { cmdkCursor = +row.dataset.i; commitCmdk(); }
});

cmdk.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowDown') { e.preventDefault(); cmdkCursor = Math.min(cmdkCursor + 1, cmdkResults.length - 1); renderCmdkList(); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); cmdkCursor = Math.max(cmdkCursor - 1, 0); renderCmdkList(); }
  else if (e.key === 'Enter') { e.preventDefault(); commitCmdk(); }
  else if (e.key === 'Escape') { e.preventDefault(); closeCmdk(); }
});

document.addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openCmdk(); }
});

const SRC_KEYS = ['srcPriority', 'srcBuyer', 'srcQty', 'srcTarget', 'srcRequiredBy', 'srcStatus', 'srcSpecs'];
let SRC_STASH = null;
const SRC_CLS = { Open:'s-shipped', Quoted:'s-inprogress', Selected:'s-confirmed', Closed:'s-delivered', Cancelled:'neutral' };
const bestQuote = r => (r.quotes || []).filter(x => num(x.price) > 0).sort((a, b) => num(a.price) - num(b.price))[0];
const prodSrcOf = pid => DATA.sourcing.filter(x => x.productId === pid).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0))[0] || null;
function prodSrcLoad(r) {
  const sr = prodSrcOf(r.id); if (!sr) return;
  r.srcPriority = sr.priority || 'Medium'; r.srcBuyer = sr.buyer || ''; r.srcQty = sr.qty ?? ''; r.srcTarget = sr.targetPrice ?? ''; r.srcRequiredBy = sr.requiredBy || ''; r.srcStatus = sr.status || 'Open'; r.srcSpecs = sr.specs || '';
  r.quotes = (sr.quotes && sr.quotes.length ? sr.quotes : [{ supplier:'', price:'', moq:'', lead:'', selected:false }]).map(q => Object.assign({}, q));
}
function prodSrcStash(r) {
  SRC_STASH = { fields:{}, quotes:(r.quotes || []).filter(q => String(q.supplier || '').trim() || num(q.price) > 0) };
  SRC_KEYS.forEach(k => { SRC_STASH.fields[k] = r[k] ?? ''; delete r[k]; });
  delete r.quotes;
}
function prodSrcSave(r) {
  const st = SRC_STASH; SRC_STASH = null; if (!st) return;
  const f = st.fields, any = st.quotes.length || ['srcBuyer', 'srcQty', 'srcTarget', 'srcRequiredBy', 'srcSpecs'].some(k => String(f[k] ?? '').trim() !== '');
  let sr = prodSrcOf(r.id);
  if (!any && !sr) return;
  const isNew = !sr;
  if (isNew) sr = { id:uid(), code:nextCode('SRC', DATA.sourcing), productId:r.id, createdAt:Date.now() };
  Object.assign(sr, { productName:r.name, buyer:String(f.srcBuyer || '').trim(), qty:f.srcQty === '' ? '' : num(f.srcQty), targetPrice:f.srcTarget === '' ? '' : num(f.srcTarget), requiredBy:f.srcRequiredBy || '', priority:f.srcPriority || 'Medium', status:f.srcStatus || 'Open', specs:String(f.srcSpecs || '').trim(), quotes:st.quotes.map(q => Object.assign({}, q, { price:num(q.price), moq:num(q.moq), lead:num(q.lead) })), updatedAt:Date.now() });
  if (sr.quotes.some(x => x.selected) && ['Open', 'Quoted'].includes(sr.status)) sr.status = 'Selected';
  else if (sr.quotes.length && sr.status === 'Open') sr.status = 'Quoted';
  if (isNew) DATA.sourcing.push(sr);
}

const PAPER = { ink:'#10151B', soft:'#3B4450', muted:'#6B7280', line:'#E2E8F0', tint:'#F1F5F4', accent:'#0D9488', accentDark:'#0F5F58' };
function catSheet(inner, extraStyle) {
  return `<div class="dv-sheet bg-white rounded card-shadow overflow-hidden relative" style="width:794px;height:1123px;color:${PAPER.ink};font-family:Inter,ui-sans-serif,system-ui,sans-serif;${extraStyle || ''}">${inner}</div>`;
}

function catSheetsHTML(cat) {
  const prods = catProds(cat), single = prods.length === 1, coName = co.name || 'Your Company';
  const loc = [co.city, co.country].filter(Boolean).join(', ');
  const addr = [co.addressLine, co.city, co.district, co.postal, co.country].filter(Boolean).join(', ');
  const logo = (size, fs) => `<div style="width:${size}px;height:${size}px;border-radius:12px;background:${PAPER.accent};display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none">${co.logo ? `<img src="${co.logo}" alt="" style="max-width:${size - 10}px;max-height:${size - 10}px;object-fit:contain">` : `<span style="font-size:${fs}px;font-weight:700;color:#fff">${initialOf(coName)}</span>`}</div>`;
  const certs = cat.includeCerts ? (co.certificates || []).filter(c => c.shared !== false && String(c.name || '').trim()) : [];
  const date = new Date().toLocaleDateString('en-GB', { day:'numeric', month:'long', year:'numeric' });
  const pages = [];
  const label = t => `<div style="font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:${PAPER.muted};font-weight:600">${t}</div>`;
  const h1 = t => `<div style="font-size:28px;font-weight:700;color:${PAPER.ink}">${t}</div><div style="width:64px;height:4px;border-radius:2px;background:${PAPER.accent};margin:8px 0 18px"></div>`;
  const h3 = t => `<div style="font-size:11px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:${PAPER.accent};margin:18px 0 10px">${t}</div>`;

  // cover
  const imgs = prods.filter(p => p.image).slice(0, 3);
  const contactBits = [['Phone', co.phone], ['Email', co.email], ['Website', co.website], ['Address', addr]].filter(x => String(x[1] || '').trim());
  const cover = catSheet(`
    <div style="position:absolute;left:56px;right:56px;top:52px;display:flex;align-items:center;gap:16px">${logo(72, 30)}
      <div><div style="font-size:22px;font-weight:700">${escapeHtml(coName)}</div><div style="font-size:12.5px;color:${PAPER.muted}">${escapeHtml([co.businessType, loc].filter(Boolean).join(' · '))}</div></div></div>
    <div style="position:absolute;left:56px;right:56px;top:240px">
      <div style="font-size:13px;letter-spacing:4px;color:${PAPER.accent};font-weight:700;text-transform:uppercase">Product catalog · ${new Date().getFullYear()}</div>
      <div style="font-size:48px;line-height:1.1;font-weight:800;margin:14px 0 18px;max-width:650px">${escapeHtml(cat.title)}</div>
      <div style="width:90px;height:6px;border-radius:3px;background:${PAPER.accent};margin-bottom:22px"></div>
      ${cat.preparedFor ? `<div style="font-size:16px;color:${PAPER.soft};margin-bottom:6px">Prepared for <b style="color:${PAPER.ink}">${escapeHtml(cat.preparedFor)}</b></div>` : ''}
      <div style="font-size:13px;color:${PAPER.muted}">${prods.length} product${prods.length === 1 ? '' : 's'} · ${escapeHtml(date)}</div></div>
    ${imgs.length ? `<div style="position:absolute;left:56px;right:56px;top:640px;display:flex;gap:16px;height:260px">${imgs.map(p => `<div style="flex:1;border-radius:16px;overflow:hidden;border:1px solid ${PAPER.line}"><img src="${p.image}" alt="" style="width:100%;height:100%;object-fit:cover"></div>`).join('')}</div>` : ''}
    <div style="position:absolute;left:0;right:0;bottom:0;height:150px;background:${PAPER.tint};border-top:3px solid ${PAPER.accent};padding:26px 56px;display:flex;gap:18px 34px;flex-wrap:wrap;align-content:flex-start;font-size:12.5px;color:${PAPER.soft}">
      ${contactBits.map(([l, v]) => `<div>${label(l)}${escapeHtml(v)}</div>`).join('')}</div>`);

  // about / certificates
  if (cat.includeProfile || certs.length) {
    const est = co.established ? new Date(co.established + 'T00:00:00').getFullYear() : '';
    const facts = [['Business type', co.businessType], ['Established', est], ['Location', loc], ['Phone', co.phone], ['Email', co.email], ['Website', co.website]].filter(x => String(x[1] || '').trim());
    const about = String(co.about || '').trim() || `${coName} is a ${(co.businessType || 'trading company').toLowerCase()}${est ? ' established in ' + est : ''}${loc ? ', based in ' + loc : ''}.`;
    const cats = {}; prods.forEach(p => { if (p.category) cats[p.category] = (cats[p.category] || 0) + 1; });
    pages.push(`${h1(cat.includeProfile ? 'About us' : 'Our certificates')}
      ${cat.includeProfile ? `<div style="font-size:13.5px;color:${PAPER.soft};line-height:1.7;margin-bottom:18px">${nl2br(about)}</div>
        ${facts.length ? `<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px">${facts.map(([l, v]) => `<div style="background:${PAPER.tint};border-radius:10px;padding:11px 14px">${label(l)}<b style="font-size:13px">${escapeHtml(String(v))}</b></div>`).join('')}</div>` : ''}
        ${Object.keys(cats).length ? `${h3('Our range in this catalog')}<div style="display:flex;gap:8px;flex-wrap:wrap">${Object.entries(cats).map(([k, n]) => `<span style="background:#E6F4F2;color:${PAPER.accentDark};border-radius:99px;padding:4px 12px;font-size:12px;font-weight:600">${escapeHtml(k)} (${n})</span>`).join('')}</div>` : ''}` : ''}
      ${certs.length ? `${h3('Certificates &amp; compliance')}<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">${certs.slice(0, 8).map(c => `<div style="border:1px solid ${PAPER.line};border-left:4px solid ${PAPER.accent};border-radius:10px;padding:10px 14px"><b style="display:block;font-size:13px">${escapeHtml(c.name)}</b><span style="font-size:11.5px;color:${PAPER.muted}">${escapeHtml([c.authority, c.number ? 'No. ' + c.number : '', c.expiry ? 'Valid until ' + fmtDate(c.expiry) : ''].filter(Boolean).join(' · '))}</span></div>`).join('')}</div>` : ''}`);
  }

  // product pages
  const showPrice = cat.showPrices !== 'No';
  const card = p => {
    const unit = escapeHtml(String(p.unit || 'pcs').toLowerCase());
    const specs = [['Composition', p.composition], ['Weight / GSM', p.weight], ['Colors', p.colors], ['Sizes', p.sizes], ['HS code', p.hsCode], ['Origin', p.origin], ['Packing', p.packaging], ['Customization', p.customization], ['Certificates', p.certs]].filter(x => String(x[1] || '').trim()).slice(0, 8);
    const feats = String(p.features || '').split(/\r?\n/).map(s => s.trim()).filter(Boolean).slice(0, single ? 8 : 4);
    const kvs = [['MOQ', num(p.moq) > 0 ? `${num(p.moq).toLocaleString()} ${p.unit}` : ''], ['Lead time', num(p.leadTime) > 0 ? `${num(p.leadTime)} days` : ''], ['Terms', [p.incoterm, p.paymentTerms].filter(Boolean).join(' · ')], ['Samples', p.sampleAvail ? p.sampleAvail + (num(p.sampleDays) > 0 ? ` (${num(p.sampleDays)} days)` : '') : '']].filter(x => x[1]);
    const tiers = prodTiers(p).slice(0, single ? 8 : 4);
    const tierHead = `<div style="display:flex;justify-content:space-between;background:${PAPER.ink};color:#fff;font-size:10.5px;font-weight:700;letter-spacing:.5px;padding:7px 12px;text-transform:uppercase"><span>Quantity</span><span>Price per ${unit}</span></div>`;
    const tierRow = (q, note, pr) => `<div style="display:flex;justify-content:space-between;gap:8px;padding:6px 12px;font-size:12px;border-top:1px solid ${PAPER.line}"><span>${q}${note ? `<i style="font-style:normal;color:${PAPER.muted};font-size:10.5px;margin-left:4px">${escapeHtml(note)}</i>` : ''}</span><b style="color:${PAPER.accentDark};font-size:13px;white-space:nowrap">${u2(pr)}</b></div>`;
    const por = `<div style="margin-top:12px;border:1px dashed #B9C3CC;border-radius:12px;padding:14px;text-align:center;color:${PAPER.soft};font-size:12.5px;background:${PAPER.tint}"><b style="display:block;font-size:14px;color:${PAPER.ink};margin-bottom:2px">Price on request</b>Contact us for a quotation</div>`;
    let price = '';
    if (!showPrice) price = por;
    else if (tiers.length) price = `<div style="margin-top:12px;border:1px solid ${PAPER.line};border-radius:12px;overflow:hidden">${tierHead}${tiers.map(t => tierRow(`${num(t.minQty).toLocaleString()}+ ${unit}`, t.note, t.price)).join('')}</div>`;
    else if (num(p.price) > 0) price = `<div style="margin-top:12px;border:1px solid ${PAPER.line};border-radius:12px;overflow:hidden">${tierHead}${tierRow(`${num(p.moq) > 0 ? num(p.moq).toLocaleString() : '1'}+ ${unit}`, '', p.price)}</div>`;
    else price = por;
    const big = single, imgW = big ? 300 : 262, imgH = big ? 360 : 238;
    return `<div style="height:${big ? 940 : 468}px;display:flex;gap:22px;padding:14px 0;${big ? '' : `border-bottom:1px solid ${PAPER.line};`}overflow:hidden">
      <div style="width:${imgW}px;flex:none"><div style="width:${imgW}px;height:${imgH}px;border-radius:16px;background:${PAPER.tint};overflow:hidden;display:flex;align-items:center;justify-content:center">${p.image ? `<img src="${p.image}" alt="" style="width:100%;height:100%;object-fit:cover">` : `<span style="font-size:80px;font-weight:800;color:#C7D0D8">${initialOf(p.name)}</span>`}</div>${price}</div>
      <div style="flex:1;min-width:0;overflow:hidden">${p.category ? `<span style="display:inline-block;background:#E6F4F2;color:${PAPER.accentDark};font-size:10.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:3px 10px;border-radius:99px">${escapeHtml(p.category)}</span>` : ''}
        <div style="font-size:${big ? 30 : 23}px;font-weight:800;margin:8px 0 2px;line-height:1.2">${escapeHtml(p.name)}</div><div style="font-size:11px;color:${PAPER.muted}">${escapeHtml(p.code)}</div>
        ${String(p.shortDesc || '').trim() ? `<div style="margin:10px 0;font-size:${big ? 13.5 : 12.5}px;color:${PAPER.soft};line-height:1.55;display:-webkit-box;-webkit-line-clamp:${big ? 8 : 3};-webkit-box-orient:vertical;overflow:hidden">${escapeHtml(p.shortDesc)}</div>` : ''}
        ${kvs.length ? `<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0">${kvs.map(([l, v]) => `<div style="background:${PAPER.tint};border-radius:10px;padding:7px 11px">${label(l)}<b style="font-size:${big ? 13.5 : 12.5}px">${escapeHtml(v)}</b></div>`).join('')}</div>` : ''}
        ${specs.length ? `<div style="display:grid;grid-template-columns:1fr 1fr;gap:5px 16px;margin:10px 0">${specs.map(([l, v]) => `<div style="font-size:${big ? 12.5 : 11.5}px;display:flex;gap:6px"><span style="color:${PAPER.muted};flex:none;width:${big ? 96 : 74}px">${l}</span><b style="font-weight:600;min-width:0">${escapeHtml(v)}</b></div>`).join('')}</div>` : ''}
        ${feats.length ? `<div style="margin-top:8px">${feats.map(f => `<div style="font-size:${big ? 13 : 12}px;color:${PAPER.soft};padding:2px 0 2px 18px;position:relative"><span style="position:absolute;left:0;color:${PAPER.accent};font-weight:700">&#10003;</span>${escapeHtml(f)}</div>`).join('')}</div>` : ''}
      </div></div>`;
  };
  const per = single ? 1 : 2;
  for (let i = 0; i < prods.length; i += per) pages.push(prods.slice(i, i + per).map(card).join(''));

  // terms & contact
  const terms = String(cat.notes || '').split(/\r?\n/).map(s => s.trim()).filter(Boolean);
  if (!terms.length) terms.push(`Prices are quoted per unit in ${co.currency || 'USD'} and are indicative until confirmed in writing.`, 'Samples, custom designs and bulk quotations are available on request.');
  if (cat.validUntil) terms.unshift(`Prices valid until ${fmtDate(cat.validUntil)}.`);
  const crow = [['Contact', [co.authName, co.authDesignation].filter(Boolean).join(', ')], ['Phone', co.phone], ['Mobile', co.mobile], ['Email', co.email], ['Website', co.website], ['Address', addr]].filter(x => String(x[1] || '').trim());
  pages.push(`${h1('Terms &amp; contact')}
    <div style="margin-bottom:22px">${terms.map(t => `<div style="font-size:13px;color:${PAPER.soft};padding:7px 0 7px 22px;position:relative;border-bottom:1px solid ${PAPER.line}"><span style="position:absolute;left:4px;top:14px;width:8px;height:8px;border-radius:50%;background:${PAPER.accent}"></span>${escapeHtml(t)}</div>`).join('')}</div>
    <div style="background:${PAPER.tint};border:1px solid ${PAPER.line};border-left:4px solid ${PAPER.accent};border-radius:16px;padding:26px 28px"><div style="font-size:22px;font-weight:700;margin-bottom:4px">${escapeHtml(coName)}</div><div style="color:${PAPER.muted};font-size:13px;margin-bottom:14px">Thank you for your interest. We look forward to working with you.</div>
      ${crow.map(([l, v]) => `<div style="display:flex;gap:10px;padding:7px 0;border-top:1px solid ${PAPER.line};font-size:13px"><span style="width:96px;flex:none;color:${PAPER.accent};font-size:11px;text-transform:uppercase;letter-spacing:1px;padding-top:2px;font-weight:600">${l}</span><b style="font-weight:600">${escapeHtml(v)}</b></div>`).join('')}</div>`);

  const total = pages.length + 1;
  const head = `<div style="position:absolute;left:0;right:0;top:0;height:78px;padding:0 48px;display:flex;align-items:center;gap:12px;border-bottom:3px solid ${PAPER.accent}">${logo(42, 18)}<b style="font-size:15px">${escapeHtml(coName)}</b><div style="margin-left:auto;font-size:11.5px;color:${PAPER.muted};max-width:300px;text-align:right">Product catalog · ${escapeHtml(cat.title)}</div></div>`;
  const foot = n => `<div style="position:absolute;left:48px;right:48px;bottom:24px;display:flex;justify-content:space-between;gap:12px;font-size:11px;color:${PAPER.muted};border-top:1px solid ${PAPER.line};padding-top:10px"><span>${escapeHtml([coName, co.phone, co.email].filter(Boolean).join('  |  '))}</span><span>Page ${n} of ${total}</span></div>`;
  return cover + pages.map((inner, i) => catSheet(`${head}<div style="position:absolute;left:48px;right:48px;top:100px;bottom:62px;overflow:hidden">${inner}</div>${foot(i + 2)}`)).join('');
}

/* Viewer (ref openCatalog 16680) */
function openCatalog(cat) {
  const prods = catProds(cat);
  if (!prods.length) { toast('This catalog has no products', 'danger'); return; }
  CAT.cur = cat; CAT.mode = 'view';
  openDocViewer({
    title:cat.title, sub:`${prods.length} product${prods.length === 1 ? '' : 's'}${cat.code ? ' · ' + cat.code : ''}`,
    sheets:catSheetsHTML(cat),
    buttons:`<button type="button" class="${UI_BTN}" data-c="customize">${icon('sliders')}Customize</button>${cat.id ? '' : `<button type="button" class="${UI_BTN}" data-c="save">${UI_SAVE_ICON}Save catalog</button>`}<button type="button" class="${UI_BTN}" data-c="send">${icon('arrowRight')}Send to buyer</button>`,
    onClick: e => { const b = e.target.closest('[data-c]'); if (b) catAction(b.dataset.c, b.dataset.id); },
    onClose: closeCat,
  });
}
function closeCat() {
  if (CAT.mode === 'view' && CAT.from === 'list') { CAT.from = ''; closeDocViewer(); catList(); return; }
  closeDocViewer(); CAT.mode = ''; CAT.cur = null; CAT.send = null;
}

/* Saved catalogs (ref catList 16695) */
function catList() {
  CAT.mode = 'list'; CAT.cur = null;
  const rows = [...DATA.catalogs].sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
  const body = rows.length ? `<div class="divide-y divide-[var(--border-inner)]">${rows.map(c => { const n = catProds(c).length; return `
    <div class="flex flex-wrap items-center gap-3 py-2.5">
      <div class="min-w-0 flex-1"><p class="fs-head font-semibold text-primary">${escapeHtml(c.title)}</p>
        <p class="text-helper text-muted">${escapeHtml(c.code)} · ${n} product${n === 1 ? '' : 's'}${c.preparedFor ? ' · for ' + escapeHtml(c.preparedFor) : ''} · ${fmtDate(new Date(c.createdAt).toISOString().slice(0, 10))}</p></div>
      <div class="flex items-center gap-1.5">
        <button type="button" class="${UI_BTN}" data-c="open-saved" data-id="${c.id}">View</button>
        <button type="button" class="${UI_BTN}" data-c="edit-saved" data-id="${c.id}">Edit</button>
        <button type="button" class="${UI_BTN}" data-c="send-saved" data-id="${c.id}">Send</button>
        <button type="button" class="${UI_BTN} hover:text-danger" data-c="del-saved" data-id="${c.id}">Delete</button>
      </div></div>`; }).join('')}</div>`
    : `<p class="py-6 text-center text-body text-muted">No saved catalogs yet. In Product Setup, tick the products you want, then click "Create catalog from selected".</p>`;
  openPanel({ id:'catPList', title:'Saved catalogs', icon:'doc', body, footer:`<button type="button" class="${UI_BTN}" data-pclose>Close</button>`,
    onClick: e => { const b = e.target.closest('[data-c]'); if (b) catAction(b.dataset.c, b.dataset.id); } });
}

/* Setup (ref catSetup / renderSetup 16705–16730) */
function catSetup(ids, existing) {
  if (!existing && !ids.length) { toast('Tick the products you want in the catalog first', 'danger'); return; }
  CAT.draft = existing ? JSON.parse(JSON.stringify(existing)) : Object.assign(catalogDefaults(), { id:null, productIds:[...ids] });
  CAT.mode = 'setup'; renderSetup();
}
function renderSetup() {
  const d = CAT.draft, prods = catProds(d);
  const sel = (k, opts) => `<select data-cf="${k}" class="${UI_INPUT}">${opts.map(([v, t]) => `<option value="${v}" ${String(d[k]) === v ? 'selected' : ''}>${escapeHtml(t)}</option>`).join('')}</select>`;
  const avail = DATA.products.filter(p => !d.productIds.includes(p.id));
  const body = `
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-x-3 gap-y-2.5">
      <label class="block min-w-0 sm:col-span-2">${biLabel('Catalog title')}<input data-cf="title" value="${escapeHtml(d.title)}" class="${UI_INPUT}"></label>
      <label class="block min-w-0">${biLabel('Prepared for (buyer)')}<input data-cf="preparedFor" list="cf_buyers" value="${escapeHtml(d.preparedFor)}" placeholder="Optional" class="${UI_INPUT}"><datalist id="cf_buyers">${allBuyers().map(b => `<option value="${escapeHtml(b)}">`).join('')}</datalist></label>
      <label class="block min-w-0">${biLabel('Prices')}${sel('showPrices', [['Yes', 'Show prices'], ['No', 'Hide prices (price on request)']])}</label>
      <label class="block min-w-0">${biLabel('Prices valid until')}<input type="date" data-cf="validUntil" value="${escapeHtml(d.validUntil)}" class="${UI_INPUT}"></label>
      <label class="block min-w-0">${biLabel('About us page')}${sel('includeProfile', [['true', 'Include'], ['false', 'Leave out']])}</label>
      <label class="block min-w-0 sm:col-span-2">${biLabel('Certificates')}${sel('includeCerts', [['true', 'Include (those marked "Show to buyers")'], ['false', 'Leave out']])}</label>
      <label class="block min-w-0 sm:col-span-2">${biLabel('Terms or special notes (one per line, shown on the last page)')}<textarea data-cf="notes" rows="3" placeholder="e.g. Prices are FOB Chattogram. Payment: 30% advance, 70% against documents." class="${UI_INPUT} h-auto py-2 resize-none">${escapeHtml(d.notes)}</textarea></label>
    </div>
    <h4 class="fs-lead font-semibold text-primary mt-4 mb-2">Products in this catalog (${prods.length})</h4>
    <div class="rounded border border-side-line divide-y divide-[var(--border-inner)]">${prods.map((p, i) => `
      <div class="flex items-center gap-2.5 px-3 py-2">${thumb(p.image)}
        <div class="min-w-0 flex-1"><p class="fs-head font-medium text-primary">${escapeHtml(p.name)}</p><p class="text-helper text-muted">${escapeHtml(p.code)}${catalogReady(p) ? '' : ' · missing price or MOQ'}</p></div>
        <button type="button" class="w-7 h-7 rounded border border-side-border text-muted hover:bg-side-hover" data-c="up" data-i="${i}" aria-label="Move up">↑</button>
        <button type="button" class="w-7 h-7 rounded border border-side-border text-muted hover:bg-side-hover" data-c="down" data-i="${i}" aria-label="Move down">↓</button>
        <button type="button" class="w-7 h-7 rounded border border-side-border text-muted hover:text-danger hover:bg-dangerSoft" data-c="rm" data-i="${i}" aria-label="Remove">✕</button>
      </div>`).join('') || '<p class="px-3 py-6 text-center text-body text-muted">No products yet.</p>'}</div>
    ${avail.length ? `<div class="flex gap-2 mt-2.5"><select id="cAdd" class="${UI_INPUT}"><option value="">Add another product…</option>${avail.map(p => `<option value="${p.id}">${escapeHtml(p.code)} · ${escapeHtml(p.name)}</option>`).join('')}</select><button type="button" class="${UI_BTN}" data-c="addprod">Add</button></div>` : ''}`;
  openPanel({ id:'catPSetup', title:d.id ? 'Edit catalog' : 'Create catalog', icon:'doc', body,
    footer:`<button type="button" class="${UI_BTN}" data-pclose>Cancel</button><button type="button" class="${UI_BTN}" data-c="preview">Preview without saving</button><button type="button" class="${UI_BTN_PRIMARY}" data-c="savepreview">${UI_SAVE_ICON}Save &amp; preview</button>`,
    onClick: e => { const b = e.target.closest('[data-c]'); if (b) catAction(b.dataset.c, b.dataset.id, b); },
    onInput: e => { const t = e.target; if (t.dataset.cf) CAT.draft[t.dataset.cf] = t.value; },
    onChange: e => { const t = e.target; if (!t.dataset.cf) return; let v = t.value; if (['includeProfile', 'includeCerts'].includes(t.dataset.cf)) v = v === 'true'; CAT.draft[t.dataset.cf] = v; },
  });
}
function saveDraft() {
  const d = CAT.draft;
  if (!String(d.title || '').trim()) { toast('Give the catalog a title', 'danger'); return null; }
  if (!d.productIds.length) { toast('Add at least one product', 'danger'); return null; }
  d.title = d.title.trim();
  if (d.id) { DATA.catalogs = DATA.catalogs.map(c => c.id === d.id ? Object.assign({}, c, d, { updatedAt:Date.now() }) : c); }

/* One action router for the viewer, the list, the setup and the send panel (ref initCatalogs 16843–16894) */
function catAction(a, id, btn) {
  const d = CAT.draft;
  if (a === 'customize') { catSetup([], CAT.cur.id ? CAT.cur : Object.assign({}, CAT.cur)); }
  else if (a === 'save') { CAT.draft = JSON.parse(JSON.stringify(CAT.cur)); const saved = saveDraft(); if (saved) { toast(saved.code + ' saved'); openCatalog(saved); } }
  else if (a === 'send') { catSendOpen(); }
  else if (a === 'send-pdf') { window.print(); }
  else if (a === 'send-email') { const s = CAT.send; catLog('Email'); window.location.href = `mailto:${encodeURIComponent(s.to.trim())}?subject=${encodeURIComponent(s.subject)}&body=${encodeURIComponent(s.body)}`; }
  else if (a === 'send-wa') {
    const s = CAT.send, num2 = String(s.phone || '').replace(/\D/g, '');
    if (!num2) { toast('Enter the buyer\'s WhatsApp number with country code', 'danger'); return; }
    catLog('WhatsApp'); window.open(`https://wa.me/${num2}?text=${encodeURIComponent(s.body)}`, '_blank', 'noopener');
  }
  else if (a === 'open-saved') { closePanel('catPList'); CAT.from = 'list'; const c = DATA.catalogs.find(x => x.id === id); if (c) openCatalog(c); }
  else if (a === 'send-saved') { closePanel('catPList'); CAT.from = 'list'; const c = DATA.catalogs.find(x => x.id === id); if (c) { openCatalog(c); catSendOpen(); } }
  else if (a === 'edit-saved') { closePanel('catPList'); const c = DATA.catalogs.find(x => x.id === id); if (c) catSetup([], c); }
  else if (a === 'del-saved') {
    const c = DATA.catalogs.find(x => x.id === id);
    if (c && confirm(`Delete catalog "${c.title}"?`)) { DATA.catalogs = DATA.catalogs.filter(x => x.id !== id); catList(); toast('Catalog deleted'); }
  }
  else if (a === 'up' || a === 'down') { const i = +btn.dataset.i, j = a === 'up' ? i - 1 : i + 1; if (j >= 0 && j < d.productIds.length) { [d.productIds[i], d.productIds[j]] = [d.productIds[j], d.productIds[i]]; renderSetup(); } }
  else if (a === 'rm') { d.productIds.splice(+btn.dataset.i, 1); renderSetup(); }
  else if (a === 'addprod') { const v = document.getElementById('cAdd').value; if (v) { d.productIds.push(v); renderSetup(); } }
  else if (a === 'preview') { if (!String(d.title || '').trim() || !d.productIds.length) { toast('Add a title and at least one product', 'danger'); return; } closePanel('catPSetup'); CAT.from = ''; openCatalog(Object.assign({}, d)); }
  else if (a === 'savepreview') { const saved = saveDraft(); if (saved) { closePanel('catPSetup'); toast(saved.code + ' saved'); CAT.from = ''; openCatalog(saved); } }
}

/* Certificate status (ref certStatus 13320) */
function certStatus(exp) {
  if (!exp) return { t:'No expiry date', c:'neutral' };
  const d = Math.ceil((new Date(exp) - new Date().setHours(0, 0, 0, 0)) / 864e5);
  if (isNaN(d)) return { t:'No expiry date', c:'neutral' };
  if (d < 0) return { t:'Expired', c:'s-pending' };
  if (d <= 60) return { t:`Expires in ${d} day${d === 1 ? '' : 's'}`, c:'s-inprogress' };
  return { t:'Valid', c:'s-confirmed' };
}

/* One supplier: purchases, payments, due, running orders and the ledger (ref supplierStats 20507) */

    const pd = isBtbPay(r) ? ((r.btbSettled || r.released) ? tot : 0) : num(r.paidAmount);
    if (pd > 0) led.push({ date:(isBtbPay(r) ? r.releasedDate : '') || isoOf(r.updatedAt) || r.date, doc:isBtbPay(r) ? 'Payment (Back-to-Back L/C)' : 'Payment', ref:r.code, debit:0, credit:pd, note:r.status });
  });
  imps.forEach(r => {
    const tot = lineTotal(r); led.push({ date:r.orderDate, doc:'Import purchase', ref:r.code + (r.invoiceNo ? ' · Inv. ' + r.invoiceNo : ''), debit:tot, credit:0, note:r.status });
    if (isBtbPay(r) && (r.btbSettled || r.released) && tot > 0) led.push({ date:r.releasedDate || r.payDate || r.orderDate, doc:'Payment (Back-to-Back L/C)', ref:r.code, debit:0, credit:tot, note:'Money released' });
  });
  acctTxns().filter(t => t.type === 'payment' && t.source !== 'payroll' && same(t.party)).forEach(t => led.push({ date:t.date, doc:'Payment (Bank & Cash)', ref:t.reference || '', debit:0, credit:num(t.amount), note:t.description || '' }));
  ledgerRun(led);
  const business = led.reduce((s, r) => s + r.debit, 0), paid = led.reduce((s, r) => s + r.credit, 0), due = Math.max(0, business - paid);
  const running = locals.filter(r => r.recvStatus !== 'Received').map(r => ({ ref:r.code, date:r.date, status:'Local · ' + (r.recvStatus || 'Pending'), value:lineTotal(r), due:r.dueDate, late:r.dueDate && r.dueDate < today() && r.status !== 'Paid' }))
    .concat(imps.filter(r => r.status !== 'Received').map(r => ({ ref:r.code, date:r.orderDate, status:'Import · ' + r.status, value:lineTotal(r), due:r.eta, late:impLate(r) })));

  return { sp, name:sp.name, locals, imps, led, business, paid, due, running, runValue:running.reduce((s, r) => s + r.value, 0), deals:deals.length, since:dates[0] || '', last:deals.map(r => r.date).filter(Boolean).sort().pop() || '',
    avg:deals.length ? business / deals.length : 0, biggest:deals.reduce((m, r) => Math.max(m, r.debit), 0), late:running.filter(r => r.late).length, products:topItems(locals.map(r => r.items).concat(imps.map(r => r.items))) };
}

const WEEKENDS = {'Friday':[5], 'Friday & Saturday':[5, 6], 'Saturday & Sunday':[6, 0], 'Sunday only':[0]};
const holidayMap = () => { const m = {}; String(HRS().holidays || '').split(/\r?\n/).forEach(l => { const t = l.trim().match(/^(\d{4}-\d{2}-\d{2})\s*(.*)$/); if (t) m[t[1]] = t[2] || 'Holiday'; }); return m; };
const isOff = d => { const h = holidayMap(); if (h[d]) return {off:true, name:h[d]}; if ((WEEKENDS[HRS().weekend] || [5]).includes(pdate(d).getDay())) return {off:true, name:'Weekly off'}; return {off:false}; };

/* ref 17708–17717 (verbatim) */
/* ================= LEAVE MATHS ================= */
function leaveDays(from, to, part){
  if (!from || !to || to < from) return 0;
  let n = 0; for (let d = pdate(from); ldate(d) <= to; d.setDate(d.getDate() + 1)) if (!isOff(ldate(d)).off) n++;
  return part === 'Half day' && from === to && n === 1 ? 0.5 : n;
}
const apprLeaves = empId => DATA.leaves.filter(l => l.employeeId === empId && l.status === 'Approved');
const leaveOn = (empId, d) => apprLeaves(empId).find(l => l.from <= d && l.to >= d);
const lvUsed = (empId, type, year, exceptId) => DATA.leaves.filter(l => l.employeeId === empId && l.leaveType === type && ['Pending', 'Approved'].includes(l.status) && l.id !== exceptId && String(l.from).slice(0, 4) === String(year)).reduce((s, l) => s + num(l.days), 0);

/* ref 17962–17987 (verbatim) */
/* ================= ATTENDANCE MATHS ================= */
function dayStatus(e, d, recs){
  if (d < (e.joinDate || '0000-00-00')) return {s:'NA'};
  if (isOff(d).off) return {s:'Off'};
  const rec = recs[d], lv = leaveOn(e.id, d), w = lv && lv.dayPart === 'Half day' ? 0.5 : 1;
  if (rec) return rec.status === 'Leave' ? {s:lv && lv.leaveType === 'Unpaid' ? 'Unpaid' : 'Leave', w, rec} : {s:rec.status, rec};
  if (lv) return {s:lv.leaveType === 'Unpaid' ? 'Unpaid' : 'Leave', w};
  return {s:'Unmarked'};
}
function attSummary(e, month){
  const recs = {}; DATA.attendance.filter(a => a.empId === e.id && String(a.date).startsWith(month)).forEach(a => recs[a.date] = a);
  const o = {working:0, present:0, late:0, absent:0, half:0, paidLeave:0, unpaid:0, unmarked:0, ot:0};
  monthDays(month).forEach(d => {
    const st = dayStatus(e, d, recs); if (st.s === 'NA' || st.s === 'Off') return;
    o.working++;
    if (st.s === 'Present') o.present++;
    else if (st.s === 'Late'){ o.present++; o.late++; }
    else if (st.s === 'Absent') o.absent++;
    else if (st.s === 'Half day') o.half++;
    else if (st.s === 'Leave'){ o.paidLeave += st.w; o.present += 1 - st.w; }
    else if (st.s === 'Unpaid'){ o.unpaid += st.w; o.present += 1 - st.w; }
    else o.unmarked++;
    if (st.rec) o.ot += num(st.rec.ot);
  });
  return o;
}

function numWords(n) {
  const a = ['', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten', 'eleven', 'twelve', 'thirteen', 'fourteen', 'fifteen', 'sixteen', 'seventeen', 'eighteen', 'nineteen'];
  const b = ['', '', 'twenty', 'thirty', 'forty', 'fifty', 'sixty', 'seventy', 'eighty', 'ninety'], sc = ['', ' thousand', ' million', ' billion', ' trillion'];
  const w = x => x < 20 ? a[x] : x < 100 ? b[Math.floor(x / 10)] + (x % 10 ? '-' + a[x % 10] : '') : a[Math.floor(x / 100)] + ' hundred' + (x % 100 ? ' ' + w(x % 100) : '');
  if (n === 0) return 'zero';
  let out = '', i = 0;
  while (n > 0 && i < sc.length) { const c = n % 1000; if (c) out = w(c) + sc[i] + (out ? ' ' + out : ''); n = Math.floor(n / 1000); i++; }
  return out;
}
function amountWords(v, cc) {

}

const piTd = 'padding:6px 8px;border-bottom:1px solid ' + PAPER.line + ';font-size:11px;vertical-align:top';
function piSheetsHTML(pi, opts = {}) {
  const pu = n => piFmt(pi, n);

  const rowHTML = (l, i) => {

    const hs = l.hsCode || (p && p.hsCode) || '', sub = [l.color, l.size, l.desc, hs ? 'HS ' + hs : ''].filter(x => String(x || '').trim()).join(' · ');
    return `<tr><td style="${piTd}">${i + 1}</td><td style="${piTd}"><b>${escapeHtml(name)}</b><div style="color:${PAPER.muted};font-size:10px">${escapeHtml(sub)}</div></td><td style="${piTd};text-align:right">${num(l.qty).toLocaleString()}</td><td style="${piTd}">${escapeHtml(String(l.unit || (p ? p.unit : 'pcs')).toLowerCase())}</td><td style="${piTd};text-align:right">${pu(l.price)}</td><td style="${piTd};text-align:right"><b>${pu(num(l.qty) * num(l.price))}</b></td></tr>`;

  const myBankLines = String(pi.myBank || '').split(/\r?\n/).map(x => x.trim()).filter(Boolean);
  const bankRows = myBankLines.length ? myBankLines.map(x => ['', x]) : [['Bank', co.bankName], ['Branch', co.bankBranch], ['Account no.', co.bankAccount], ['SWIFT', co.swift]].filter(x => String(x[1] || '').trim());
  const notes = String(pi.notes || '').split(/\r?\n/).map(s => s.trim()).filter(Boolean);
  const ship = [['Incoterm', pi.incoterm], ['Payment', pi.paymentTerms], ['Mode of transport', pi.transport], ['Country of origin', pi.originCountry], ['Port of loading', pi.portLoading], ['Port of discharge', pi.portDischarge], ['Destination country', pi.destCountry], ['Shipment', pi.shipment]].filter(x => String(x[1] || '').trim());
  const box = (h, body) => `<div style="flex:1;border:1px solid ${PAPER.line};border-radius:8px;padding:10px 12px"><div style="font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:${PAPER.accentDark};font-weight:700;margin-bottom:4px">${h}</div><div style="font-size:11.5px;line-height:1.5;color:${PAPER.soft}">${body}</div></div>`;
  const trow = (l, v, strong) => `<div style="display:flex;justify-content:space-between;padding:3px 0;${strong ? `border-top:2px solid ${PAPER.accent};margin-top:4px;padding-top:6px;font-size:14px;font-weight:700;color:${PAPER.accentDark}` : 'font-size:11.5px'}"><span>${l}</span><b>${v}</b></div>`;
  const totals = `<div style="display:flex;gap:18px;margin-top:14px;align-items:flex-start">

  const single = items.length <= 6, chunks = [];
  if (single) chunks.push(items.slice());

  const total = chunks.length;
  const meta = [[opts.dateLabel || 'PI date', fmtDate(pi.piDate)], ['Valid until', fmtDate(pi.validUntil)], ['Buyer PO', pi.buyerPoNo || (po ? po.buyerPoNo || po.code : '')], ['L/C no.', pi.lcNo], ['L/C date', pi.lcDate ? fmtDate(pi.lcDate) : ''], ['Currency', pi.currency || co.currency || 'USD'], ...(pi.metaExtra || [])].filter(x => x[1] && x[1] !== '—' || x[0] === 'Currency');
  const foot = n => `<div style="position:absolute;left:48px;right:48px;bottom:24px;display:flex;justify-content:space-between;font-size:9.5px;color:${PAPER.muted};border-top:1px solid ${PAPER.line};padding-top:6px"><span>${escapeHtml([coName, co.phone, co.email].filter(Boolean).join('  |  '))}</span><span>Page ${n} of ${total}</span></div>`;
  return chunks.map((rows, ci) => {
    const first = ci === 0, last = ci === total - 1, off = first ? 0 : (single ? 0 : 10 + (ci - 1) * 20);
    const top = first ? `<div style="display:flex;align-items:center;gap:14px">${logo}<div style="flex:1;min-width:0"><b style="font-size:16px">${escapeHtml(coName)}</b><div style="font-size:10.5px;color:${PAPER.muted};line-height:1.5">${escapeHtml(addr)}<br>${escapeHtml([co.phone, co.email, co.website].filter(Boolean).join('  |  '))}</div></div>

      <div style="height:3px;background:${PAPER.accent};border-radius:2px;margin:12px 0"></div>
      <div style="display:flex;flex-wrap:wrap;gap:8px 22px;margin-bottom:12px">${meta.map(([l, v]) => `<div><div style="font-size:9.5px;text-transform:uppercase;color:${PAPER.muted}">${l}</div><b style="font-size:12px">${escapeHtml(v)}</b></div>`).join('')}</div>
      <div style="display:flex;gap:12px;margin-bottom:14px">${box('Bill to', `<b>${escapeHtml(pi.buyer)}</b><br>${pi.buyerContact ? 'Attn: ' + escapeHtml(pi.buyerContact) + '<br>' : ''}${nl2br(pi.buyerAddress || lead.address || '')}${pi.buyerEmail || lead.email ? '<br>' + escapeHtml(pi.buyerEmail || lead.email) : ''}${pi.buyerBank ? `<br><span style="color:${PAPER.muted}">Bank:</span> ${nl2br(pi.buyerBank)}` : ''}`)}${box('Seller', `<b>${escapeHtml(coName)}</b><br>${escapeHtml(addr)}${co.authName ? '<br>Contact: ' + escapeHtml(co.authName) : ''}`)}</div>`
      : `<div style="display:flex;align-items:center;gap:12px">${logo}<div><b>${escapeHtml(coName)}</b><div style="font-size:10.5px;color:${PAPER.muted}">${opts.title ? escapeHtml(opts.title) : 'Proforma Invoice'} ${escapeHtml(pi.code)} (continued)</div></div></div><div style="height:3px;background:${PAPER.accent};border-radius:2px;margin:12px 0"></div>`;
    return catSheet(`<div style="padding:44px 48px">${top}<table style="width:100%;border-collapse:collapse">${tHead}<tbody>${rows.map((l, i) => rowHTML(l, off + i)).join('')}</tbody></table>${last ? totals : `<div style="text-align:center;color:${PAPER.muted};font-size:11px;margin-top:14px">Continued on next page</div>`}</div>${foot(ci + 1)}`);
  }).join('');
}

const DOCSEND = { o:null, s:null };
function docSend(o) {
  const lead = o.noCrm ? null : crmVis().find(l => sameBuyer(l.company, o.buyer));
  DOCSEND.o = o; DOCSEND.s = { leadId:lead ? lead.id : '', to:(lead && lead.email) || o.email || '', phone:lead ? lead.phone || '' : (o.phone || ''), subject:o.subject, body:o.body(lead), log:!o.noCrm };
  docSendRender();
}
function docSendRender() {
  const s = DOCSEND.s, o = DOCSEND.o;
  const body = `<div class="grid grid-cols-1 sm:grid-cols-2 gap-x-3 gap-y-2.5">
      ${o.noCrm ? '' : `<label class="block min-w-0 sm:col-span-2">${biLabel('Buyer from your CRM')}<select data-sf="leadId" class="${UI_INPUT}"><option value="">Not in CRM / type details below</option>${crmVis().map(l => `<option value="${l.id}" ${l.id === s.leadId ? 'selected' : ''}>${escapeHtml(l.company)}</option>`).join('')}</select></label>`}
      <label class="block min-w-0">${biLabel('Email')}<input type="email" data-sf="to" value="${escapeHtml(s.to)}" placeholder="buyer@company.com" class="${UI_INPUT}"></label>
      <label class="block min-w-0">${biLabel('WhatsApp number')}<input data-sf="phone" value="${escapeHtml(s.phone)}" placeholder="With country code, e.g. 8801700000000" class="${UI_INPUT}"></label>
      <label class="block min-w-0 sm:col-span-2">${biLabel('Subject')}<input data-sf="subject" value="${escapeHtml(s.subject)}" class="${UI_INPUT}"></label>
      <label class="block min-w-0 sm:col-span-2">${biLabel('Message')}<textarea data-sf="body" rows="9" class="${UI_INPUT} h-auto py-2 resize-none">${escapeHtml(s.body)}</textarea></label>
      ${o.noCrm ? '' : `<label class="flex items-center gap-2 sm:col-span-2 fs-head text-secondary"><input type="checkbox" data-sf="log" ${s.log ? 'checked' : ''}> Record this in the buyer's CRM activity log (needs a CRM buyer)</label>`}</div>
    <div class="flex items-start gap-2.5 px-4 py-3 rounded-md bg-infoSoft mt-3"><span class="text-info shrink-0 mt-0.5">${iconSvg('info', 'w-4 h-4')}</span><p class="fs-head text-secondary">A web page cannot attach files to an email or chat by itself. Save the document first with "Print / Save as PDF", then attach that PDF to the email or WhatsApp message that opens.</p></div>`;
  openPanel({ id:'catPDocSend', title:'Send ' + o.title, icon:'arrowRight', body,
    footer:`<button type="button" class="${UI_BTN}" data-pclose>Close</button><button type="button" class="${UI_BTN}" data-ds="pdf">Print / Save as PDF</button><button type="button" class="${UI_BTN}" data-ds="wa">Open WhatsApp</button><button type="button" class="${UI_BTN_PRIMARY}" data-ds="email">Open email</button>`,
    onClick: e => { const b = e.target.closest('[data-ds]'); if (b) docSendAction(b.dataset.ds); },
    onInput: e => { const t = e.target; if (t.dataset.sf && DOCSEND.s) DOCSEND.s[t.dataset.sf] = t.type === 'checkbox' ? t.checked : t.value; },
    onChange: e => { const t = e.target; if (!DOCSEND.s) return;
      if (t.dataset.sf === 'log') DOCSEND.s.log = t.checked;
      if (t.dataset.sf === 'leadId') { const l = crmVis().find(x => x.id === t.value); DOCSEND.s.leadId = t.value; if (l) { DOCSEND.s.to = l.email || ''; DOCSEND.s.phone = l.phone || ''; DOCSEND.s.body = DOCSEND.o.body(l); docSendRender(); } } },
  });
}
function docSendLog(type) {
  const s = DOCSEND.s, o = DOCSEND.o;
  if (o.onSent) o.onSent();
  if (!s.log || !s.leadId) return;
  const l = crmVis().find(x => x.id === s.leadId); if (!l) return;
  l.activities = Array.isArray(l.activities) ? l.activities : [];
  l.activities.push({ date:today(), type, note:'Sent ' + o.title }); l.lastActivity = today(); if (l.status === 'Lead') l.status = 'Contacted'; l.updatedAt = Date.now();
  toast('Recorded in the CRM');
}
function docSendAction(a) {
  const s = DOCSEND.s;
  if (a === 'pdf') window.print();
  else if (a === 'email') { docSendLog('Email'); window.location.href = `mailto:${encodeURIComponent(s.to.trim())}?subject=${encodeURIComponent(s.subject)}&body=${encodeURIComponent(s.body)}`; }
  else if (a === 'wa') { const n = String(s.phone || '').replace(/\D/g, ''); if (!n) { toast("Enter the WhatsApp number with country code", 'danger'); return; } docSendLog('WhatsApp'); window.open(`https://wa.me/${n}?text=${encodeURIComponent(s.body)}`, '_blank', 'noopener'); }
}

function piMessage(pi, lead) {

  const sign = [co.authName, co.authDesignation, co.name, [co.phone, co.email, co.website].filter(Boolean).join(' | ')].filter(x => String(x || '').trim()).join('\n');
  return `Dear ${first || 'Sir or Madam'},\n\nGreetings from ${co.name || 'our company'}.\n\nPlease find attached our Proforma Invoice ${pi.code} dated ${fmtDate(pi.piDate)}${(pi.buyerPoNo || (po && po.buyerPoNo)) ? ' against your PO ' + (pi.buyerPoNo || po.buyerPoNo) : ''}, total ${piFmt(pi, piTotal(pi))}.${pi.validUntil ? '\n\nThis invoice is valid until ' + fmtDate(pi.validUntil) + '.' : ''}\n\nKindly confirm by signing and returning a copy, and arrange payment as per the agreed terms${pi.paymentTerms ? ' (' + pi.paymentTerms + ')' : ''}.\n\nBest regards,\n${sign}`;

function openPI(id) {
  const pi = DATA.pis.find(x => x.id === id); if (!pi) return;

  openDocViewer({
    title:`Proforma Invoice ${pi.code}`, sub:`${pi.buyer} · ${piFmt(pi, piTotal(pi))}`, sheets:piSheetsHTML(pi),

    onClick: e => {

    },
  });
}

    onInput: e => { if (e.target.dataset.gi !== undefined) paint(); },

  const ov = document.getElementById('catPGrn'), note = (cls, h) => `<div class="flex items-start gap-2.5 px-4 py-3 rounded-md ${cls} fs-head text-secondary">${h}</div>`;

    if (L.some(x => x.recv > 0)) mode = (!over.length && !short.length) ? 'exact' : (allow && !over.length) ? 'partial' : 'amend';

/* ---------- reverse / print a GRN ---------- */
function grnReverse(id) {
  const g = DATA.grns.find(x => x.id === id); if (!g) return;
  if (!invAllowNeg()) {
    const bad = g.items.find(it => stockAt('raw', it.productId, g.piId || '') - it.received < -0.0005);
    if (bad) { toast(`Cannot reverse: ${bad.productName} has only ${fmtQ(stockAt('raw', bad.productId, g.piId || ''))} in Raw Stock now. Allow negative stock on the Dashboard (Inventory setting) to force it.`, 'danger'); return; }
  }
  if (!confirm(`Reverse ${g.code}?\n\nThe received quantities are taken out of stock and ${g.purchaseCode} goes back to waiting for receipt.${g.amended ? '\nThe invoice amendment made at that time is NOT undone.' : ''}`)) return;
  const pur = DATA[g.source].find(x => x.id === g.purchaseId);
  if (pur) {
    g.items.forEach(it => { let left = it.received; for (let i = pur.items.length - 1; i >= 0 && left > 0; i--) { const l = pur.items[i]; if (l.productId !== it.productId) continue; const take = Math.min(num(l.received), left); l.received = r3(num(l.received) - take); left = r3(left - take); } });

    if (g.source === 'localpurchase') pur.recvStatus = recvState(pur);
    pur.updatedAt = Date.now(); MODS[g.source].render();
  }
  DATA.invmoves = DATA.invmoves.filter(m => m.refId !== g.id); DATA.grns = DATA.grns.filter(x => x.id !== g.id);
  invRefresh(); toast(g.code + ' reversed');
}

const r2 = n => Math.round(num(n) * 100) / 100;
function calcPay(e, month, adj = {}) {
